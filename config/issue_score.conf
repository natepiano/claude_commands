# Maximum concurrent scoring requests.
# whole: 1..
workers=8

# Model used for scoring requests.
# one of: jev-1.14.0
model=jev-1.14.0

# Maximum authorized spend in USD.
# range: 0..
budget_usd=20.0

# Input cost per million tokens in USD.
# range: 0..
input_usd_per_million=0.042

# Minimum goal confidence.
# range: 0..1
threshold.backlog_goal=0.40

# Minimum alignment confidence.
# range: 0..1
threshold.backlog_alignment=0.40

# Minimum impact confidence.
# range: 0..1
threshold.backlog_impact=0.40

# Minimum category confidence.
# range: 0..1
threshold.category=0.90

# Minimum gap between the first two area probabilities.
# range: 0..1
threshold.area=0.3

# Maximum measured error for backlog_goal.
# range: 0..1
error_target.backlog_goal=0.1

# Maximum measured error for category.
# range: 0..1
error_target.category=0.1

# Maximum measured error for area.
# range: 0..1
error_target.area=0.1

# Maximum measured error for backlog_impact.
# range: 0..1
error_target.backlog_impact=0.1

# Maximum measured error for backlog_alignment.
# range: 0..1
error_target.backlog_alignment=0.1

# Evidence above this value is present.
# range: 0..1
evidence_present=0.7

# Evidence below this value is absent.
# range: 0..1
evidence_absent=0.3

# Minimum probability for a separated score mode.
# range: 0..1
split_probability=0.25

# Maximum issue body characters sent to the service.
# whole: 1..
body_character_limit=24000

# Service endpoint for scoring requests.
# one of: https://api.typesafe.ai/v1/systemone
endpoint=https://api.typesafe.ai/v1/systemone

# Maximum request attempts.
# whole: 1..
max_attempts=5

# Timeout for one HTTP request in seconds.
# range: 5e-324..
request_timeout=120

# Base for exponential retry delays in seconds.
# range: 5e-324..
retry_backoff_base=2.0

# Path of the recorded spend ledger.
# one of: ~/.local/state/issue-score/spend.jsonl
spend_ledger=~/.local/state/issue-score/spend.jsonl

# Folder for run and review artifacts.
# one of: ~/.local/state/issue-score
state_dir=~/.local/state/issue-score

# Root folder of the issue vault.
# one of: ~/rust/hanadocs
vault_root=~/rust/hanadocs

# Root folder of the shared style rules.
# one of: ~/rust/nate_style
style_rules_root=~/rust/nate_style

# Default number of blind preference questions.
# whole: 1..
blind_sample_count=20

# Body length below which a report uses the title-only group.
# whole: 0..
title_only_character_limit=200

# Maximum disagreement rows per field in a report.
# whole: 1..
disagreement_count=20

# Number of confidence buckets in reliability tables.
# whole: 1..
reliability_bucket_count=5
