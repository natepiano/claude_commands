# Global model registry. scripts/lib/models_registry.py owns its path and parser.
# Launchers share one operation configuration through scripts/agents/models_config.sh.
#
# [assignments] selects a family.
# Each [<function>.<family>] section selects an agent and optional effort per task.
# [<family>.agents] validates each row.
# A [<function>.options] section holds that function's launch flags — not agent
# rows, and not read by agents_resolve; its consumer reads the key it owns.
# scripts/agents/sync_codex_catalog.sh refreshes [codex.agents] and
# [codex.families] from the Codex config and models cache. Claude catalogs
# and family aliases are hand-maintained.
#
# Consumers, all through agents_resolve/agent_exec:
#   - worker implementation and review
#   - CLI aliases
#   - production unit directors (add_unit.py)
#
# An empty effort uses the agent CLI default.

# ── major function → family: the switch ──
[assignments]
direct=codex
direct.simplify=claude
cli=codex
production=claude
design_roles=codex

# Producers use name=family:model:effort through models_registry.launch_settings.
[producers]
morty=codex:astra:high
brain=codex:astra:medium
dwight=claude:fable:high

# ── production (unit directors, launched by add_unit.py) ──
# Unit directors launch only on Claude. The showrunner is whichever session
# runs /showrunner:produce; this registry does not launch it. Directors default
# to Opus at xhigh (the user, 2026-10-07, moved back from sonnet:xhigh); change
# the value to move them.
[production.claude]
director=opus:xhigh

# ── held design roles (scripts/astra/design_roles.py) ──
[design_roles.codex]
designer=astra:xhigh
reviewer=astra:xhigh

# ── direct (/unit:direct) ──
# One vocabulary: a task names the kind of work, and there are four kinds. The
# retired keys — architect, mechanical, escalation — named how hard an agent to
# send, not what it was doing, so this list answered two questions at once and
# neither axis could be read off a key. The tier axis is gone: an escalated
# pass is `impl`, a trivial repair is `fix`, an architecture review is `review`.
[direct.codex]
impl=sol:high
test=sol:high
fix=sol:high
review=sol:high

[direct.claude]
simplify=opus:high
impl=opus:high
test=opus:high
fix=opus:high
review=opus:xhigh

# ── cli (~/.zshrc aliases via scripts/cli_agent/cli_agent.sh) ──
[cli.codex]
commit_prep=luna:high         # aliases: commit_no, commit_yes
merge_branch=luna:high        # alias: merge
interactive=sol:high         # alias: code (REPL)

[cli.claude]
commit_prep=sonnet:high
merge_branch=sonnet:high
interactive=opus:max

# ── validation catalogs: agent=comma-separated valid efforts ──
[codex.agents]
# Generated by scripts/agents/sync_codex_catalog.sh — do not hand-edit.
gpt-6.1-sol=low,medium,high,xhigh,max,ultra
gpt-6-astra=low,medium,high,xhigh,max,ultra
gpt-6.1-terra=low,medium,high,xhigh,max,ultra
gpt-6-sol=low,medium,high,xhigh,max,ultra
gpt-6-luna=low,medium,high,xhigh,max
gpt-5.6-sol=low,medium,high,xhigh,max,ultra
gpt-5.6-terra=low,medium,high,xhigh,max,ultra
gpt-5.6-luna=low,medium,high,xhigh,max

[codex.families]
# Generated by scripts/agents/sync_codex_catalog.sh — do not hand-edit.
astra=gpt-6-astra
luna=gpt-6-luna
sol=gpt-6.1-sol
terra=gpt-6.1-terra

[claude.agents]
# Hand-maintained. Claude agent names are the CLI's short aliases.
fable=low,medium,high,xhigh,max
opus=low,medium,high,xhigh,max
sonnet=low,medium,high,xhigh,max
haiku=low,medium,high,xhigh,max

[claude.families]
fable=fable
opus=opus
sonnet=sonnet
haiku=haiku

# ── context windows: family=<first version with it>:<window> ──
# Read by scripts/hooks/context_usage.py to place the auto-compaction trigger
# the hooks warn against. Keys are the Claude family aliases above. A model at
# or above the listed version has that window; one below it, or in a family
# not listed, has `default`. Transcribed from the Claude CLI's embedded
# model-capabilities table (2.1.259). A new family or a family whose first
# 1M release changes is a new row here, never a change to the hook.
[claude.context]
default=200k
sonnet=5:1m
opus=4.7:1m
fable=5:1m
mythos=5:1m
