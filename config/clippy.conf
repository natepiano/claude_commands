# /clippy delegation tuning — whether the lint scan and the fix work run in
# subagents, and how wide the parallel fix wave may open.
#
# Read by scripts/lint/clippy_config.sh, which validates every key and prints
# CLIPPY_<KEY>=<value> lines for the /clippy skill. This file is authoritative:
# the reader carries no defaults, so a missing key, a malformed value, or a
# value below its minimum makes it print every problem it found and exit 2.
# /clippy treats that exit as delegation unavailable and runs the whole pipeline
# inline, exactly as it did before this file existed — the lint still runs, and
# the reason is reported rather than swallowed.
#
# Hand-edited, like config/delegate.conf. config/lint.conf has an editor
# (/lint_config) because its keys are on/off switches over the checks
# themselves; these are tuning values for one command.
#
# What this file does NOT control: which checks run. That is config/lint.conf,
# and its answer applies to every consumer, not just /clippy.

# Whether the mend/clippy/doc scan runs in its own subagent, which keeps raw
# cargo output out of the main conversation and returns finished finding rows.
# `off` runs those stages inline in the main agent.
#
# Treated as off regardless of this value when /clippy is invoked with
# `auto-proceed` (delegate work orders, codex sub-sessions): a codex session has
# no agent tool to launch one with.
SCAN_AGENT=on

# Whether an approved fix batch may be split across parallel fixer agents.
# `off` keeps every fix in the main agent, however large the batch.
FANOUT=on

# Total findings a batch needs before a fan-out is considered at all. Below
# this the main agent fixes them itself: N agents cost a partition, N composed
# prompts, and a supervision loop, and a short batch closes before that spends
# itself back.
MIN_FINDINGS=12

# Distinct files the findings must cover. A fixer owns whole files so that no
# two of them ever edit the same one, so a batch concentrated in three files
# cannot be split however many findings it holds.
MIN_FILES=4

# Hard ceiling on concurrent fixers. They all edit one worktree, so each one
# added buys less parallel work and costs more coordination.
MAX_AGENTS=4

# Findings per fixer, used to size the wave:
#   agents = min(MAX_AGENTS, files / 2, ceil(findings / FINDINGS_PER_AGENT))
# A wave that computes to fewer than 2 agents runs inline instead.
FINDINGS_PER_AGENT=8

# Seconds between supervision reports while the fix wave runs. Each report
# costs the main agent a turn of its own generation, and a fixer closes its
# assignment in minutes rather than the tens of minutes a delegate phase takes,
# so this sits well below PLAN_DELEGATE_PROGRESS_INTERVAL_SECONDS in
# config/delegate.conf.
PROGRESS_INTERVAL_SECONDS=120
