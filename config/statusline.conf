# role.<role-with-hyphens> and account.<label> set field colors; a role with no key (worker,
# unassigned) shows as plain text.
# level.* colors show usage levels; tokens.* are percent used, left.* percent left.
# counts.<type> colors each part of the "For you:" row; questions are red to catch the eye.
role.showrunner=purple
role.unit-director=yellow
role.astra-designer=mauve
role.astra-reviewer=bright-green

account.claude1=brown
account.claude2=magenta
account.claude3=blue
account.claude4=orange
account.codex1=pink
account.codex2=teal
account.claude5=cyan

counts.questions=bright-red
counts.changes=bright-cyan
counts.efficiency=bright-green
counts.proposals=purple
counts.adhoc_items=pink

# Retry a failed counts read after this many seconds.
# whole: 1..
counts.retry_seconds=5

level.ok=bright-green
level.warn=bright-yellow
level.alarm=bright-red
tokens.warn=80
tokens.alarm=90
left.warn=10
left.alarm=5

# Compare the running systems with the systems from this ref.
rebuild.repo=/etc/nixos
rebuild.ref=main
rebuild.natedev=natedev
rebuild.mac=MacBook-Pro
rebuild.ssh=mac
rebuild.interval=60
# Allow this many seconds for Nix evaluation.
rebuild.eval_timeout=120
# Wait this many seconds before retrying a failed evaluation for the same commit.
rebuild.eval_retry_seconds=600
rebuild.cache=~/.local/state/showrunner/rebuilds
