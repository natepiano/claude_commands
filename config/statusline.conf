# role.<role-with-hyphens> (including unassigned) and account.<label> set field colors.
# level.* colors show usage levels; tokens.* are percent used, left.* percent left.
role.showrunner=bright-magenta
role.unit-director=bright-blue
role.worker=bright-cyan
role.unassigned=purple

account.claude1=cyan
account.claude2=magenta
account.claude3=blue
account.claude4=orange
account.codex1=pink
account.codex2=teal

level.ok=bright-green
level.warn=bright-yellow
level.alarm=bright-red
tokens.warn=80
tokens.alarm=90
left.warn=10
left.alarm=5
