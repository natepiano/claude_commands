# Required retirement limits, read at use by agents.
# range: 5e-324..
RETIRE_POLL_SECONDS=0.2
# range: 5e-324..
RETIRE_TERM_WAIT_SECONDS=10
# range: 5e-324..
RETIRE_COMMAND_TIMEOUT_SECONDS=900

# Default time for the main Hana run.
# whole: 1..
mac_run_hold_seconds=60

# SSH destination for the Mac run.
mac_run_host=natemccoy@mac

# BRP port for the Mac run.
# whole: 1..
mac_run_port=15710

# First BRP port for production units.
# whole: 1..
unit_port_first=15720

# Last BRP port for production units.
# whole: 1..
unit_port_last=15789

# Remote log for the main Hana run.
mac_run_log=/tmp/mac_run_hana.log

# Remote Terminal command for the Mac run.
mac_run_launch=/tmp/mac_run_hana.command

# Remote exit record for the Mac run.
mac_run_status=/tmp/mac_run_hana.status

# Time for each demo example.
# whole: 1..
mac_run_example_seconds=20

# Maximum time to wait for the Mac claim.
# whole: 1..
mac_run_claim_seconds=600

# Minimum macOS version for the test build.
mac_run_deployment_target=14.0

# Extra time to wait for the exit record.
# whole: 1..
mac_run_status_grace_seconds=60

# Delay between exit record checks.
# whole: 1..
mac_run_poll_seconds=1

# Maximum main log lines after an early exit.
# whole: 1..
mac_run_log_lines=20

# Maximum example log lines after an early exit.
# whole: 1..
mac_run_example_log_lines=10

# Remote Git bundle for the Mac run.
mac_run_bundle=/tmp/mac_run.bundle

# Remote log prefix for each demo example.
mac_run_example_log_prefix=/tmp/mac_run_

# Remote repository for the scratch clone.
mac_run_source=~/rust/hana

# Demo examples separated by semicolons; each entry names a crate, example, and optional feature.
mac_run_examples=hana_diegetic typography;hana_diegetic units;hana_diegetic widgets;hana_diegetic diegetic_text_stress;hana_conduit playground;hana_lagrange showcase fit_overlay;hana_liminal all_modes;hana_valence staggered_unfold;hana_mimesis_tools show_beam

# Default BRP port for a smoke launch.
# whole: 1..
smoke_port=15790

# Maximum time for BRP readiness.
# whole: 1..
smoke_ready_seconds=300

# Maximum time for a graceful exit.
# whole: 1..
smoke_exit_seconds=30

# Maximum time to connect to BRP.
# whole: 1..
smoke_connect_seconds=1

# Maximum time for a BRP request.
# whole: 1..
smoke_call_seconds=5

# Delay after the termination signal.
# whole: 1..
smoke_signal_grace_seconds=2

# Delay between readiness and exit checks.
# whole: 1..
smoke_poll_seconds=1

# Time before a prompt alert.
# range: 0..
PROMPT_ALERT_SECONDS=60

# Maximum time for resumed rows to become live.
# range: 5e-324..
RENAME_LIVE_WAIT_SECONDS=180

# Maximum time for the selected rows to stop.
# range: 5e-324..
RENAME_RUN_STOP_WAIT_SECONDS=120

# Delay between session observations.
# range: 5e-324..
RENAME_POLL_SECONDS=1

# Maximum time for each rename Git command.
# range: 5e-324..
RENAME_COMMAND_TIMEOUT_SECONDS=900

# Recipient for units table anomalies (the user, 2026-11-05).
UNIT_ANOMALIES_TO=sdlc

# Terminal width in columns that the /showrunner:units style table fits.
# whole: 40..
units_table_columns=170

# Minimum terminal width where both phase tables retain their table form.
# whole: 40..
units_table_floor_columns=120

# Maximum wrapped lines per cell in Claude Code 2.1.319.
# whole: 1..4
units_table_cell_lines=4

# Minimum width of a word without a `-`, `/` or `_` mark that the phase tables break.
# whole: 2..
units_table_break_columns=30

# Time limit in milliseconds to read the calling pane's width for the phase tables.
# The tables use units_table_floor_columns when the read fails or takes longer.
# whole: 1..
units_table_width_read_milliseconds=50
