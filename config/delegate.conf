# /plan:delegate convergence limits — how many automatic fix rounds a phase gets
# before the run stops and hands control to the user.
#
# Read by scripts/delegate/findings.py at startup, so an edit applies to the
# next `findings.py gate` with nothing to restart. Every value is a whole
# number of rounds or attempts except REPAIR_ROUNDS_PER_FINDING, which is a
# rate. A missing key, a non-numeric value, or a value below its minimum falls
# back to the default compiled into findings.py and warns on stderr.
#
# `findings.py gate` stops on the first condition that trips; the keys below
# are the only knobs on those conditions.

# Floor on the per-phase repair budget. Every phase gets at least this many
# automatic fix rounds no matter how few findings the first round opened.
MIN_REPAIR_BUDGET=3

# Rounds bought per gating finding counted on the first round: 8 findings buy a
# 4-round budget, and the floor above applies when the product is smaller.
# Repairs dispatch one batch per round, so N findings should close in about N/2
# rounds; a phase that needs materially more is bleeding rather than
# converging. Must be greater than 0.
REPAIR_ROUNDS_PER_FINDING=0.5

# Hard ceiling on fix rounds per phase, whatever the budget computes to.
RUNAWAY_ROUNDS=5

# Stop when one finding has failed to close this many times.
MAX_FIX_ATTEMPTS=2

# Stop when one finding has been reopened this many times after being accepted.
MAX_REOPENS=2

# Stop when the gating open count has not decreased across this many
# consecutive rounds.
STALLED_ROUNDS=2

# Stop after this many consecutive passes of the same kind inside one phase.
MAX_CONSECUTIVE_SAME_KIND_PASSES=3

# Blind reviews that <DualReview/> may preempt per phase before the gate
# concludes the broad review is never completing.
MAX_REVIEW_CANCELLATIONS=1
