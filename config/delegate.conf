# /unit:direct tuning — the convergence limits that decide when a phase's
# progress gets remarked on to the user, plus the progress-report interval.
#
# The convergence limits are read by scripts/delegate/findings.py at startup, so
# an edit applies to the next `findings.py gate` with nothing to restart. Every
# one is a whole number of rounds or attempts except REPAIR_ROUNDS_PER_FINDING,
# which is a rate. This file is authoritative: findings.py carries no defaults,
# so a missing key, a non-numeric value, or a value below its minimum makes it
# print every problem it found and exit 2 before running any command.
#
# `findings.py gate` never stops the run: it answers `converged` or `dispatch`,
# and the first condition below that trips names itself in the verdict's
# `advisory` string while the round dispatches anyway. So each key sets when a
# sentence gets said, not when work halts — the user reads it and decides.

# Floor on the per-phase repair budget. Every phase gets at least this many
# automatic fix rounds no matter how few findings the first round opened.
MIN_REPAIR_BUDGET=3

# Rounds bought per gating finding counted on the first round: 8 findings buy a
# 4-round budget, and the floor above applies when the product is smaller.
# Repairs dispatch one batch per round, so N findings should close in about N/2
# rounds; a phase that needs materially more is bleeding rather than
# converging. Must be greater than 0.
REPAIR_ROUNDS_PER_FINDING=0.5

# Hard ceiling on fix rounds per phase, whatever the budget computes to.
RUNAWAY_ROUNDS=5

# Report when one finding has failed to close this many times.
MAX_FIX_ATTEMPTS=2

# Report when one finding has been reopened this many times after being accepted.
MAX_REOPENS=2

# Report when the gating open count has not decreased across this many
# consecutive rounds.
STALLED_ROUNDS=2

# Report after this many consecutive passes of the same kind inside one phase.
MAX_CONSECUTIVE_SAME_KIND_PASSES=3

# Blind reviews that <DualReview/> may preempt per phase before the gate
# concludes the broad review is never completing.
MAX_REVIEW_CANCELLATIONS=1

# Seconds between user-facing progress reports while a delegated phase is
# active: the Codex poll timeout and the default interval of a Claude unit's
# notifier instance. Read by scripts/delegate/unit_notifier.sh and by the main
# agent per <ProgressContract/> in commands/unit/direct.md, not by findings.py.
# A missing or non-numeric value makes the notifier use 900 seconds; Codex requires
# a positive integer.
#
# Each report costs the main agent about 40 seconds of its own generation on top
# of this interval, so a short pass pays for two reports it barely outlives.
# Keep this at or above the median blind review (~5 minutes); shortening it buys
# a finer clock and spends a large share of the run's main-agent budget on it.
PLAN_DELEGATE_PROGRESS_INTERVAL_SECONDS=900
