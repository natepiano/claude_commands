# Whether eligible test runs use the Mac.
# one of: on, off
offload=on

# SSH host used for Mac test work.
host=mac

# Seconds allowed while SSH opens a connection.
# range: 5e-324..
connect_timeout_s=6

# Seconds allowed for the Mac availability probe.
# range: 5e-324..
probe_timeout_s=15

# Seconds to wait before probing again after the Mac is unreachable.
# range: 5e-324..
unreachable_backoff_s=300

# Free space in GiB that must remain on the Mac home volume. The local folder
# audit removes idle test clones below this floor, keeping unsaved source.
# range: 5e-324..
free_floor_gib=100

# Default size limit in GiB for the Mac mirror's build folder.
# range: 5e-324..
mac_budget_gib=24

# Size limit in GiB for the hana mirror's build folder.
# range: 5e-324..
mac_budget_gib.hana=56

# Packages in hana that must run on Linux.
linux_only.hana=hana_video,hana_clerestory

# Packages in cargo-liner that run on Linux: none. Every member builds and
# tests on macOS; cargo-berth's cold full Mac run passed 1268/1268 (fde451aa).
# The key stays, empty, because it is what sends the repository to the Mac.
linux_only.cargo-liner=

# Nextest filter expression excluded from hana runs on the Mac.
mac_skip.hana=test(world_panel_words_match_drawn_pixels)

# Repository whose workflow can use the Mac runner. Empty disables CI calls.
ci_repo=natepiano/hana

# Repository variable that lets the workflow start its Mac job.
ci_variable=MACOS_CI

# Workflow used when checking current and skipped CI runs.
ci_workflow=ci.yml

# Job that occupies the Mac and is skipped while the switch is off.
ci_job=macOS: Compile and Test

# Maximum time allowed for one gh call.
# range: 5e-324..
gh_timeout_s=30

# Default lifetime of a Mac block.
# range: 5e-324..
block_hours=4

# Longest lifetime accepted for a Mac block.
# range: 5e-324..
block_max_hours=48

# Minutes before expiry when the holder is reminded.
# range: 5e-324..
block_warn_minutes=15

# Minutes with no Mac process before its claim is released.
# range: 5e-324..
claim_idle_minutes=15

# Seconds between claim activity checks on the Mac.
# range: 5e-324..
claim_poll_seconds=60

# Seconds allowed for leftover Mac process cleanup.
# range: 5e-324..
leftover_timeout_s=10

# Free space in GiB retained by every Mac floor sweep. It must meet free_floor_gib.
# range: 5e-324..
sweep_floor_gib=150

# Only marked build output and mirrors inside these three roots can be swept.
sweep_floor_roots=/tmp ~/rust ~/.local/state/mac-test/mirror
