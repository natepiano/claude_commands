# Keep Mac test offload disabled until its live check is complete.
offload=off

# Repository whose workflow can use the Mac runner. Empty disables CI calls.
ci_repo=natepiano/hana

# Repository variable that lets the workflow start its Mac job.
ci_variable=MACOS_CI

# Workflow used when checking current and skipped CI runs.
ci_workflow=ci.yml

# Job that occupies the Mac and is skipped while the switch is off.
ci_job=macOS: Compile and Test

# Earlier job that reads the switch before the Mac job is created.
ci_gate_job=macOS: Runner Availability

# Maximum time allowed for one gh call.
gh_timeout_s=30

# Default lifetime of a Mac block.
block_hours=4

# Longest lifetime accepted for a Mac block.
block_max_hours=48

# Minutes before expiry when the holder is reminded.
block_warn_minutes=15
