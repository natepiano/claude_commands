# Shared workflow timing values, in seconds.

# How often /plan:delegate translates delegate heartbeat activity into a
# user-facing progress update. Must be a positive integer; invalid values fall
# back to 120. This is the interval after any tick that showed new activity.
PLAN_DELEGATE_PROGRESS_INTERVAL_SECONDS=240

# Exponential backoff for a quiet delegate. A tick whose heartbeat tail is
# identical to the previous one multiplies the interval by this factor; the
# next tick that shows new activity resets it to the base interval above.
# A long silent stretch of one activity is exactly where per-tick narration
# costs the most and says the least. Invalid values fall back to 2.
PLAN_DELEGATE_PROGRESS_BACKOFF_FACTOR=2

# The ceiling the backoff climbs to, so a quiet run never goes fully dark.
# Invalid values fall back to 1800.
PLAN_DELEGATE_PROGRESS_INTERVAL_MAX_SECONDS=1800
