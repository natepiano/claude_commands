# The zone every time shown to the user is written in: reports, tables, alerts
# and the examples in skills. Read by scripts/lib/user_zone.py at each call, so
# an edit applies to the next report with nothing to restart.
#
#   zone=<IANA zone name>
#
# The label beside a time (EDT, PST) comes from the zone, never from a script.
# It is one setting for every production; a production doc's own `User zone` line is not read.
zone=America/New_York
