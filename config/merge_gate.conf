# When off, the nightly run sends no result push. The user may remove this push later.
# one of: on, off
nightly_result_push=on
# Maximum number of failed test modules named in the result push.
# whole: 1..
nightly_result_modules=8
# Reruns alone after a test module exceeds the gate memory limit.
# whole: 0..
memory_stop_reruns=1
