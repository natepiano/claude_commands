# Branches whose commits passed a merge gate.
# text:
landing_branches=main builds natedev sdlc
# When off, the nightly run sends no result push. The user may remove this push later.
# one of: on, off
nightly_result_push=on
# Maximum number of failed test modules named in the result push.
# whole: 1..
nightly_result_modules=8
# Minutes before an unassigned red nightly sends its result push.
# whole: 1..
nightly_assign_minutes=30
# Reruns alone after a test module exceeds the gate memory limit.
# whole: 0..
memory_stop_reruns=1
# Scan paths for targeted tests: <folder>/<test file>:<repository path>.
# text:
scan_roots=build_queue/test_queue_evidence.py:scripts/build_queue build_queue/test_queue_evidence.py:scripts/lint build_queue/test_queue_evidence.py:config build_queue/test_queue_place.py:scripts/build_queue build_queue/test_queue_place.py:scripts/lint build_queue/test_queue_place.py:config exclude/test_exclude.py:scripts/exclude feature_log/test_feature_log.py:scripts/feature_log feature_log/test_inventory.py:scripts/feature_log hooks/test_push_gate.py:scripts/hooks hooks/test_push_gate.py:scripts/notify issue_score/test_experiment.py:scripts/issue_score issue_score/test_score_issues.py:scripts/issue_score maintenance/test_vault_commit.py:scripts/maintenance message/test_install_codex_agents.py:scripts/message message/test_install_codex_agents.py:codex new_rust_project/test_rust_generate.py:scripts/new_rust_project new_rust_project/test_rust_generate.py:templates review_links/test_review_link.py:scripts/review_links review_links/test_review_link.py:config usage/test_collect_mac.py:scripts/usage aws_target/test_admin_secrets.py:scripts/aws_target aws_target/test_admin_secrets.py:config aws_target/test_box.py:scripts/aws_target aws_target/test_box.py:config build_hold/test_hold_enforcer.py:scripts/build_hold build_hold/test_hold_enforcer.py:scripts/agents build_hold/test_hold_enforcer.py:scripts/direct build_hold/test_hold_enforcer.py:scripts/production build_hold/test_target_hold.py:scripts/build_hold build_hold/test_target_hold.py:scripts/mac_test build_hold/test_target_hold.py:scripts/build_targets build_hold/test_target_hold.py:config mac_test/test_target_state.py:scripts/mac_test mac_test/test_target_state.py:scripts/build_targets mac_test/test_target_state.py:config message/test_postmaster.py:scripts/message message/test_postmaster.py:config aws_target/test_cloud_gate.py:scripts/aws_target aws_target/test_cloud_gate.py:config notify/test_push_texts.py:scripts/notify notify/test_push_texts.py:scripts/message production/test_merge_checkpoint_batch.py:scripts/prod