# Each region holds a first-person plan and a context reason to resume later.
# Limit each region to this many characters after whitespace is collapsed.
window: 200
action: \b(?:I|we)(?:['’]ll|\s+(?:will|plan to|intend to|need to|must|should))\s+(?!(?:not|never|no)\b)\w+
marker: \bafter (?:the )?(?:context )?compaction\b
marker: \bafter (?:the )?context reset\b
marker: \bonce (?:the )?context (?:compacts|is compacted|resets|is reset)\b
marker: \bonce (?:the )?(?:context )?compaction (?:finishes|completes|is done|ends)\b
marker: \bin (?:the next|a fresh|a new) (?:window|context)\b
state: (?<!['’]s )\b(?:my |our |the )?context(?: window)?(?: (?:is|was)|['’]s) (?:nearly |almost |getting )?(?:full(?! of\b)|exhausted|running out|running low|low)\b
state: \b(?:I am|I['’]m|we are|we['’]re) (?:nearly |almost )?out of context\b
state: \b(?:near|nearing|approaching|at) (?:the |my )?context limit\b
later: \blater\b
later: \bafterwards?\b
later: \bafter (?:the )?reset\b
exclude: \bhook\b
