# Lint policy — which checks run, everywhere they run.
#
# Read by scripts/lint/lint_config.sh. Each key is one kind of check, and its
# value applies to every consumer that honors this file; there is no
# per-consumer override. The only valid values are `on` and `off`; anything
# else is reported as an error and the check is treated as `on`. The
# exceptions are numeric settings under [build], [sweep] and [memory] below.
# scripts/lint/memory_admit.py read_memory_config() reads all [memory] values.
#
# Use /lint_config to view or change these.
#
# Consumers:
#   - scripts/lint/lint — standalone lint commands, including /commit_prep
#   - scripts/direct/verify.sh — the `lint` arm
#   - commands/unit/style_review.md — the phase style review and manual runs
#   - scripts/validate_and_push/validate_ci.sh — its two cargo-mend steps only
#   - scripts/lint/invoke.sh run() — the background sweep after every build step
#
# Deliberately NOT gated, because a release or CI check that silently no-ops is
# worse than a noisy one:
#   - scripts/release/pre_release_checks.sh
#   - scripts/validate_and_push/validate_ci.sh, except its cargo-mend steps —
#     mend rewrites source, so a mend release that emits a fix which does not
#     compile blocks every push from an affected repo with nothing the repo can
#     do about it. Every other step there ignores this file.
#   - verify.sh doc — the mandatory workspace rustdoc checkpoint gate
#   - verify.sh check / test / example, and the workspace check
#     and test inside verify.sh final — those are correctness gates, not lints
#
# A missing file means every check is on.

[operations]

# cargo mend — the check pass and its --fix pass.
#   verify.sh lint · standalone lint mend · validate_ci.sh mend steps
mend=on

# Style-guide walk over the caller's diff.
#   commands/unit/style_review.md — the phase style review and manual runs
style_review=on

# cargo clippy.
#   verify.sh lint · standalone lint clippy
clippy=on

# cargo doc with -D warnings (rustdoc as a lint).
#   standalone lint doc only; verify.sh doc ignores this switch
doc=on

# cargo +nightly fmt.
#   verify.sh lint · standalone lint fmt
fmt=on

# lint sweep — hold the project's target directory under the budget below,
# least recently used build output first.
#   invoke.sh run(), in the background after every build step · `lint sweep`
sweep=on

[build]

# Kernel oom_score_adj for build scopes: invoke.sh sets it; buildlog/memory.py
# classifies earlyoom kills with it (through scripts/lint/config_values.py).
# Valid integer range: -1000..1000. Missing or malformed falls back to 500.
build_oom_score_adj=500

[sweep]

# Keep output used within this many minutes until older output is exhausted.
# Applies only to unit order within one target at its budget.
recent_minutes=60

# Target directory budget in GiB. sweep_budget_gib.<repo> is one repo's budget,
# where <repo> is the name of the directory holding the git common dir, so it
# covers every worktree of that repo; sweep_budget_gib is every other repo's.
# LINT_SWEEP_BUDGET_GIB in the environment overrides both. A value that is not
# a non-negative number fails the sweep, naming the key. hana's working set is
# measured in sweep.py's header.
sweep_budget_gib=24
sweep_budget_gib.hana=96

# Free-space floor in GiB. While the disk holding the home has less free than
# sweep_free_floor_gib.<host> (else sweep_free_floor_gib), every sweep also
# takes only the shortfall, from the least recently used idle target first;
# a target's stamp and build units determine its last use. No key, no floor.
# natedev only: its disk filled on 2026-10-03. The user lowered it from 500 to
# 300 on 2026-10-06, so build caches have room. See sweep.py's header.
sweep_free_floor_gib.natedev=300

# Tell natedev once when a floor lock holds cleanup back this many minutes.
floor_lock_alert_minutes=15

[memory]

# First peak until this host has history for the program.
program_first_peak_gib.rust-analyzer=18
# Queue-place sampler interval, stop grace, and near-peak refresh spacing.
program_sample_seconds=1
program_stop_seconds=5
peak_wave_seconds=60

# A measured step keeps its admission promise through its initial ramp.
ramp_seconds=120
# 2026-10-29 freeze: full avg10 stayed below 10 during about 30 s of thrash.
full_pressure_limit=5.0
# The same freeze had swap 80–87% used with some avg10 29–37%.
swap_used_limit=85.0
some_pressure_limit=25.0
# Four starts promised 10.3 GiB in 42 s before that 30 s thrash.
recovery_start_seconds=30
# Bound recovery after the freeze: one ramp window after pressure clears.
recovery_window_seconds=120
# A step held this long gets room first when it can start.
head_seconds=600
strict_seconds=600
backfill_seconds=120
# Per-kind near-peak gaps: retained buildlog samples are slice aggregates;
# .wave retains only the latest pair, not a within-step sample timeline.
# natedev 2026-10-17..31: kind | steps | gap samples | p95 gap | hold s
# build   |   187 | 0 | unavailable | 1500
# check   |  2123 | 0 | unavailable | 1500
# clippy  |  6083 | 0 | unavailable | 1500
# doc     |  1613 | 0 | unavailable | 1500
# fmt     |  6499 | 0 | unavailable | 1500
# launch  |     1 | 0 | unavailable | 1500
# mend    |  3330 | 0 | unavailable | 1500
# nextest |  7768 | 0 | unavailable | 1500
# sweep   | 10171 | 0 | unavailable | 1500
# taplo   |  3037 | 0 | unavailable | 1500
# Other kinds: 0 retained gap samples, default 1500 unless explicitly set below.
# No measured per-kind override is justified by these retained records.
# Override idiom: peak_hold_seconds.<kind>=<whole seconds>.
peak_hold_seconds=1500
# merge-gate: no per-step near-peak timeline is retained (.wave keeps only
# the latest pair), so 180 s is a set value, not a measured p95. Module bursts
# recur within the gate's own ~10 min run; pressure limits stop new admissions
# if a re-peak meets a newly admitted step. Director's call, 2026-10-31.
peak_hold_seconds.merge-gate=180

# 84e50a6b's stall by build anon (10.1% at 16-20 GiB, 15.7% at 20-24,
# 22.3% at 24-28), then since 2026-10-29 13:00 EDT 3.1%, 4.2%, 7.9%;
# 24 is a one-day trial from 2026-10-31.
build_budget_gib=24

# Narrow-key replay: 2.3% of 869 no-compile runs exceeded N × 1.2.
# 1.314 removed only 2–13 more excesses and freed 15% less memory.
# The test-phase replay on 2026-10-31 had hana 2/22 and tool-based-ui-trunk 1/2
# above the charge, 3/194 in total.
test_phase_margin=1.2

# Refresh running-step readings even when no step waits.
running_pass_seconds=5
waiting_pass_seconds=1
wait_reply_seconds=60
replay_retention_seconds=86400
reconnect_seconds=2
silence_seconds=120
outage_notice_seconds=60
source_check_seconds=1
source_settle_seconds=2
override_reconnect_seconds=10
# Maximum complete request size, including its newline, in bytes.
request_max_bytes=1048576
