# Lint policy — which checks run, everywhere they run.
#
# Read by scripts/lint/lint_config.sh. Each key is one kind of check, and its
# value applies to every consumer that honors this file; there is no
# per-consumer override. The only valid values are `on` and `off`; anything
# else is reported as an error and the check is treated as `on`. The
# exceptions are numeric settings under [clippy], [build] and [sweep].
# Admission settings live in config/build_admission.conf.
#
# Use /lint_config to view or change these.
#
# Consumers:
#   - scripts/lint/lint — standalone lint commands, including /commit_prep
#   - scripts/direct/verify.sh lint [<package>] [--check]
#   - commands/unit/style_review.md — the phase style review and manual runs
#   - scripts/validate_and_push/validate_ci.sh — its two cargo-mend steps only
#   - scripts/lint/invoke.sh run() — the background sweep after every build step
#
# Deliberately NOT gated, because a release or CI check that silently no-ops is
# worse than a noisy one:
#   - scripts/release/pre_release_checks.sh
#   - scripts/validate_and_push/validate_ci.sh, except its cargo-mend steps —
#     mend rewrites source, so a mend release that emits a fix which does not
#     compile blocks every push from an affected repo with nothing the repo can
#     do about it. Every other step there ignores this file.
#   - verify.sh doc — the mandatory workspace rustdoc checkpoint gate
#   - verify.sh check / test / example, and the workspace check
#     and test inside verify.sh final — those are correctness gates, not lints
#
# A missing file means every check is on.

[operations]

# cargo mend — the check pass and its --fix pass.
#   verify.sh lint · standalone lint mend · validate_ci.sh mend steps
mend=on

# Style-guide walk over the caller's diff.
#   commands/unit/style_review.md — the phase style review and manual runs
style_review=on

# cargo clippy.
#   verify.sh lint · standalone lint clippy
clippy=on

# cargo doc with -D warnings (rustdoc as a lint).
#   standalone lint doc only; verify.sh doc ignores this switch
doc=on

# cargo +nightly fmt.
#   verify.sh lint · standalone lint fmt
fmt=on

# lint sweep — hold the project's target directory under the budget below,
# least recently used build output first.
#   invoke.sh run(), in the background after every build step · `lint sweep`
sweep=on

[clippy]

# invoke.sh reads this limit for cargo clippy --fix on Linux and macOS.
# Missing or invalid values use 8.
# whole: 1..9999
clippy_fix_jobs=8

# Maximum fix + fmt passes after a judgment reports lint findings.
# Read by verify.sh at repair time. Integer 1..9999; missing or invalid uses 3.
clippy_fix_pass_limit=3

[build]

# Kernel oom_score_adj for build scopes: invoke.sh sets it; buildlog/memory.py
# classifies earlyoom kills with it (through scripts/lib/conf.py).
# Missing or malformed Python reads recover the newest valid committed value.
# whole: -1000..1000
build_oom_score_adj=500

[sweep]

# Keep output used within this many minutes until older output is exhausted.
# Applies only to unit order within one target at its budget.
# range: 0..
recent_minutes=60

# Target directory budget in GiB. sweep_budget_gib.<repo> is one repo's budget,
# where <repo> is the name of the directory holding the git common dir, so it
# covers every worktree of that repo; sweep_budget_gib is every other repo's.
# LINT_SWEEP_BUDGET_GIB in the environment overrides both. A value that is not
# a non-negative number fails the sweep, naming the key. hana's working set is
# measured in sweep.py's header.
# range: 0..
sweep_budget_gib=24
# range: 0..
sweep_budget_gib.hana=96

# Free-space floor in GiB. While the disk holding the home has less free than
# sweep_free_floor_gib.<host> (else sweep_free_floor_gib), every sweep also
# takes only the shortfall, from the least recently used idle target first;
# a target's stamp and build units determine its last use. No key, no floor.
# natedev only: its disk filled on 2026-10-03. The user lowered it from 500 to
# 300 on 2026-10-06, so build caches have room. See sweep.py's header.
# range: 0..
sweep_free_floor_gib.natedev=300

# Send one phone alert when free space falls below this line.
# Send sweep failures only to natedev.
# range: 0..
sweep_phone_floor_gib=150

# Rearm the alert only above the line plus this margin in GiB.
# range: 0..
sweep_phone_rearm_gib=5

# Minutes above the rearm line before the disk is back.
# range: 0..
sweep_phone_rearm_minutes=60

# Retain each crossing's delivery key across process restarts for one year.
# range: 1..
sweep_crossing_repeat_minutes=525600

# Free-space floor on other filesystems that hold build output, in percent.
# range: 0..100
sweep_free_floor_percent=20

# Tell natedev once when a floor lock holds cleanup back this many minutes.
# range: 0..
floor_lock_alert_minutes=15

# Resource settings. Values retain the existing behavior.

# Minimum idle time before the audit names a loose folder.
# whole: 1..
folder_min_age_seconds=86400

# Idle time before the audit removes a loose folder.
# whole: 1..
folder_remove_after_seconds=604800

# Maximum folder depth for the idle scan.
# whole: 1..
folder_idle_depth=3

# Maximum entries in one idle scan.
# whole: 1..
folder_idle_entry_limit=50000

# Maximum transcript files in one search.
# whole: 1..
folder_rg_files_per_call=500

# Maximum transcript lines for the session start time.
# whole: 1..
folder_start_lines=20

# Maximum bytes in one transcript start line.
# whole: 1..
folder_start_bytes=1048576

# State folder for the daily folder audit.
folder_state_dir=~/.local/state/folder-sweep

# Maximum size of the rustdoc merge index in MiB.
# range: 0..
sweep_doc_index_mib=250.0

# Number of process lock reads before a lock is absent.
# whole: 1..
sweep_proc_locks_reads=3

# Maximum bytes read from a dependency file header.
# whole: 1..
sweep_dep_info_head_bytes=4096

# Maximum depth for Cargo build tree discovery.
# whole: 1..
sweep_max_tree_depth=3

# Roots for Cargo target discovery.
sweep_floor_roots=~/rust ~/.local/state ~/.cache /tmp

# CI targets measured outside the removable roots.
sweep_ci_targets=/var/lib/hana-ci/hana-linux-1 /var/lib/hana-ci/hana-linux-2 /build/hana-ci/hana-linux-1 /build/hana-ci/hana-linux-2

# Maximum interval for a disk growth comparison.
# range: 0..
sweep_growth_window_seconds=1800

# Maximum age of a current disk snapshot.
# range: 0..
sweep_snapshot_max_age_seconds=900

# Minimum interval between disk alerts.
# range: 0..
sweep_alert_interval_seconds=3600

# Maximum length of a phone alert.
# whole: 1..
sweep_push_text_limit=500

# Unexplained disk loss that triggers an alert.
# whole: 1..
sweep_unexplained_fall_bytes=10737418240

# Unnamed disk loss beyond cache growth that requests a folder walk.
# whole: 1..
sweep_walk_request_fall_bytes=10737418240

# Minimum age of the last folder walk before a request.
# range: 0..
sweep_walk_request_interval_seconds=7200

# Removed bytes that trigger an alert.
# whole: 1..
sweep_large_removal_bytes=34359738368

# Maximum folder depth for target discovery.
# whole: 1..
sweep_floor_search_depth=8

# Maximum time passed to the session sender.
# range: 0..
sweep_sender_timeout_seconds=30

# Use window before a build hold starts.
# range: 0..
sweep_holder_lookback_seconds=180

# Use stamp tolerance after a sweep deletion.
# range: 0..
sweep_delete_stamp_grace_seconds=2

# Maximum time to read build history.
# range: 0..
sweep_history_timeout_seconds=120

# Minimum compiled crates for a cold rebuild.
# whole: 1..
sweep_cold_crates=50

# Path widths tried when an alert exceeds its limit.
sweep_message_path_widths=256 128 96 72 56 40 24 16

# Maximum length of a session alert.
# whole: 1..
sweep_message_limit=1024

# Maximum disk measurement paths in an alert.
# whole: 1..
sweep_measurement_paths=3

# Maximum measured folders in a floor alert.
# range: 3..5
sweep_alert_folder_count=3

# Folder names excluded from target discovery.
sweep_floor_skip=.git node_modules

# Maximum concurrent target scans.
# whole: 1..
sweep_scan_workers=4
# whole: 1..
sweep_scan_workers.natedev=1

# Maximum concurrent directory searches.
# whole: 1..
sweep_discovery_workers=4
