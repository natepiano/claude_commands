# Limits for scripts/agents/catch_up.py, read at each run.

# Blocks printed when --blocks is not given.
# whole: 1..100000
blocks=150

# Characters kept from one message when --chars is not given.
# whole: 1..1000000
message_chars=4000

# Characters kept from one tool call or tool result line.
# whole: 1..100000
tool_chars=200

# Bytes read from the end of a transcript before the read window doubles.
# whole: 1..1073741824
window_bytes=8388608
