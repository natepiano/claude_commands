# Keep Hana placement inactive until the later activation decision.
enabled=off
# Stop a boot that receives no fresh work permit within this interval.
# whole: 1..60
guard_grace_seconds=60
# Check the permit independently of the controller and command.
# whole: 1..60
watchdog_check_seconds=1
# Bound one renewal window; Phase C renews permission for longer steps.
# whole: 1..1800
permit_max_seconds=1800
# Bound all Hana command CPU use to this many vCPUs.
# whole: 1..8
step_cpu_limit=4
# Bound all Hana command memory use, leaving room for the guest services.
# whole: 1..24
step_memory_gib=24
# Bound device discovery and the data mount operation.
# whole: 1..60
mount_timeout_seconds=15
# Use the Ohio region for the kept box and its storage.
region=us-east-2
# Provide 32 GiB of memory for the bounded Hana command.
instance_type=m7a.2xlarge
# Reserve compute at this bid ceiling.
# range: 0.001..
spot_max_usd_per_hour=0.15
# Retain the root volume while the box exists.
# whole: 1..
root_gib=40
# Retain source and build folders on the data volume.
# whole: 1..
data_gib=300
# Bound Hana spending within the unchanged account limit.
# range: 0.01..
daily_budget_usd=6
# Estimate standard gp3 storage with a 30-day month.
# range: 0.001..
gp3_usd_per_gib_month=0.08
