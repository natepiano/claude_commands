# Time allowed for a session to stop after SIGTERM.
# whole: 1..300
STOP_GRACE_SECONDS=2

# Time allowed for a session to stop after SIGKILL.
# whole: 1..300
KILL_GRACE_SECONDS=5

# Extra time allowed for an account move to stop a worker.
# whole: 1..300
MOVE_STOP_MARGIN_SECONDS=3

# range: 5e-324..
START_SECONDS=20
# range: 5e-324..
STAY_SECONDS=10

# Time a restart waits for the session's own pane to reach the shell.
# range: 0..300
OWN_PANE_SHELL_SECONDS=30

# Time allowed to confirm director work after restart.
# range: 0..3600
RESUME_CHECK_SECONDS=180

# Time between transcript reads during the restart check.
# range: 5e-324..300
RESUME_CHECK_INTERVAL_SECONDS=5
