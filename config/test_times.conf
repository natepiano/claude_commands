# Keep a passing test's time when the test takes at least this many seconds.
# Basis: 17,423 tests in 664 modules on 2026-11-03.
# Module times total about 5,000 s, with a mean of 0.3 s for each test.
# range: 0..
SLOW_TEST_S=0.5

# Rank each module by the median wall time of this many valid runs.
# whole: 1..
TOP_RUNS=5

# Count runs from this checkout. Expand the home directory before matching.
TOP_CHECKOUT=~/worktrees/claude-natedev-builds

# Count runs within this many days of the current time.
# whole: 1..
TOP_MAX_AGE_DAYS=7

# The coverage overlap tool trusts these binaries to start no Python under -I, -S or -E.
COVERAGE_LEAF_PROGRAMS=git
