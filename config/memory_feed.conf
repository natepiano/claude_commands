# Publish the build memory page in this folder.
output_folder=~/.local/share/review-links/h7uj5c

# Read the queue and refresh the page at this interval in seconds.
# range: 1..60
interval_seconds=3

# Show this many days of build history in the charts and the top costs.
# It must be at least TOP_COST_RECENT_DAYS in the build log config.
# whole: 1..90
history_days=7

# Show this many of the largest swap users; one line sums the rest.
# whole: 1..50
swap_rows=6

# Read the build history charts and top costs again after this many seconds.
# The report read costs about 0.45 s of CPU, and its data changes slowly.
# whole: 30..3600
report_refresh_seconds=300
