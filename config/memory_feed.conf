# Publish the build memory page in this folder.
output_folder=~/.local/share/review-links/h7uj5c

# Read the queue and refresh the page at this interval in seconds.
# range: 1..60
interval_seconds=3

# Read Mac build activity at this interval in seconds.
# A reading becomes old after twice this interval.
# whole: 1..3600
mac_activity_refresh_seconds=30

# Show this many days of build history in the charts and the top costs.
# It must be at least TOP_COST_RECENT_DAYS in the build log config.
# whole: 1..90
history_days=7

# Keep the main swap owners visible. Sum smaller owners after this row count.
# whole: 1..50
swap_rows=6

# Read the build history charts and top costs again after this many seconds.
# The report read costs about 0.45 s of CPU, and its data changes slowly.
# whole: 30..3600
report_refresh_seconds=300

# Use six hexadecimal digits for memory outside natedev and the Machine column.
remote_memory_light=626a78
remote_memory_dark=a0a8b6
machine_natedev_light=6243a6
machine_natedev_dark=bba0ef
machine_mac_light=526b13
machine_mac_dark=b5ca72
machine_aws_light=855126
machine_aws_dark=dbaa7d
