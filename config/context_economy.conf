# Track these settings.json keys.
settings_keys = autoCompactWindow precomputeCompactionEnabled model

# Track these repository files by content size and hash.
files = commands/unit/direct.md docs/direct/write_prompt_contract.md

# Exclude smaller request samples from comparisons.
# whole: 1..
min_requests = 20

# End an active stretch after a longer request gap, in seconds.
# whole: 1..
active_gap_seconds = 600

# Show this number of complete hours in `hourly`.
# whole: 1..
hourly_recent_hours = 8

# Measure normal and busy `hourly` rows over this number of days.
# whole: 1..
hourly_baseline_days = 7

# Limit one Mac read to this number of seconds.
# whole: 1..
mac_timeout_seconds = 300

# Bound reproducible transcript summaries; keep summaries whose source is gone.
# whole: 1..
cache_max_megabytes = 512

# Show file progress at this interval, in seconds.
# whole: 1..
progress_seconds = 1
