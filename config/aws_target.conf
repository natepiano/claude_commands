# Account settings for temporary cloud gates and trials.
# The following instance type prices historical builder costs.
# one of: m7a.4xlarge
instance_type=m7a.4xlarge
region=us-east-2
credentials_profile=build-scaler

# GPU trial tool check limit, in seconds.
# range: 0.001..
gpu_size_trial_preflight_timeout_s=120

# The user sets these two limits. Change each value only on this line. Never raise these values in code.
# range: 0.001..
monthly_limit_usd=400
# range: 0.001..
daily_limit_usd=35
# one of: drain
limit_action=drain
# range: 0.001..
fixed_usd_per_month=76.21
# range: 0.001..
fallback_usd_per_hour=0.483

# Keep this spending reserve below each account cap.
# range: 0.001..
limit_reserve_usd=3

# Cost evidence uses this zone for day and month boundaries.
accounting_zone=America/New_York
# whole: 1..
price_refresh_seconds=3600
# whole: 1..
price_max_age_seconds=7200
# whole: 1..
observation_max_age_seconds=300
# whole: 1..
cost_explorer_interval_seconds=86400
# Refresh recent UTC days because AWS can revise their charges.
# whole: 1..
cost_explorer_lookback_days=7
# UTC days in the report's gate type comparison, including the report day.
# whole: 1..
gate_type_window_days=14
# range: 0..
cost_explorer_read_usd=0.01
# Charge each box for at least one minute.
# whole: 1..3600
box_minimum_seconds=60

# Historical builder estimates include these components once.
# range: 0..
retained_storage_usd_per_month=40
# range: 0..
root_storage_usd_per_month=2.56
# range: 0..
ipv4_usd_per_month=3.65
# range: 0..
gp3_iops_usd_per_month=15
# range: 0..
gp3_throughput_usd_per_month=15

# Limit events use the existing message interface.
notification_recipient=builds
# whole: 1..
notification_timeout_s=30

# Minimum interval between limit notice attempts, in seconds.
# whole: 1..
notification_retry_s=300

# Bound account and regional price requests.
# range: 0.001..
aws_timeout_s=30

# Limit the redacted reason in each snapshot error to this many characters.
# whole: 1..
snapshot_error_reason_max_chars=240

# Deployment applies this resource tag. Cost Explorer reads the whole account.
cost_explorer_tag_key=BuildTarget
cost_explorer_tag_value=aws-build

# Deployment stays local until the user runs deploy.py apply.
deployment_profile=build-admin
stack_name=aws-build
ami_id=ami-07bfb1e3c271e2e69
ami_owner_id=427812963091
nixos_release=26.05
availability_zone=us-east-2c
vpc_id=vpc-02b2101974d585198
subnet_id=subnet-013611edfb0913d71
# The private file holds one address; the repo is public, so never put the address in a tracked file.
notification_email_file=~/.config/aws-build/notification-email
root_device_name=/dev/xvda
# whole: 1..
root_volume_gib=32
# whole: 500..500
data_volume_gib=500
# whole: 6000..6000
data_volume_iops=6000
# whole: 500..500
data_volume_throughput=500
# range: 0.001..
spot_max_usd_per_hour=0.483
# whole: 1..100
budget_notice_low_percent=50
# whole: 1..100
budget_notice_high_percent=80
# whole: 100..100
budget_stop_percent=100
# whole: 1..
deployment_timeout_s=900
# Limit each CloudFormation wait call.
# whole: 1..
stack_wait_timeout_s=3600
# whole: 1..
preflight_max_age_s=300
scaler_user_name=build-scaler
# Keep these legacy deployment inputs for shared validation.
bootstrap_template_path=/etc/nixos/hosts/aws-bootstrap.sh.in
scripts_source_url=https://github.com/natepiano/claude_commands/archive/aeb936809630c8a539613d4b0def9dce0db040c0.tar.gz
scripts_source_sha256=sha256-w7EaA5hgfojThARQqaam11wPW0l8D93DELuWGnknMo0=
scripts_source_commit=aeb936809630c8a539613d4b0def9dce0db040c0
# Retry the new scaler key while IAM publishes its permissions.
# whole: 1..
scaler_key_check_attempts=12
# range: 0.001..
scaler_key_check_delay_s=5

# Encrypt administrator AWS and Tailscale credentials with one terminal passphrase.
admin_secret_file=~/.config/aws-build/admin.gpg
# Bound resource teardown and recovery.
# whole: 60..7200
box_setup_timeout_s=3600
# Set the delay between teardown checks.
# range: 0.001..60
box_check_delay_s=5

# Seconds between deployment progress messages.
# range: 0.001..
deploy_progress_interval_s=60
