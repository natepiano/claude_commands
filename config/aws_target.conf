# Keep this target disabled until the Phase 8 user gate.
offload=off
host=aws-build
region=
instance_id=
credentials_profile=build-scaler
kinds=test,check,doc

# SSH and retry limits, in seconds.
connect_timeout_s=6
probe_timeout_s=15
unreachable_backoff_s=300
capacity_backoff_s=300

# Storage and admission limits, in GiB.
free_floor_gib=100
build_budget_gib=32
slots=2
slots.hana=4
slots.cargo-liner=4
target_budget_gib=24
target_budget_gib.hana=32
skip.hana=
skip.cargo-liner=

# Start and idle controls.
start_after_wait_s=120
start_min_waiting=2
idle_stop_minutes=15

# User limits, 2026-11-01. Never raise these values in code.
monthly_limit_usd=400
daily_limit_usd=20
limit_action=drain
fixed_usd_per_month=74
fallback_usd_per_hour=0.483

# Reserve spending capacity for a drain of at most 60 minutes.
limit_reserve_usd=3
drain_max_minutes=60

# Disable GitHub calls on this target.
ci_repo=

# Hold and claim settings. The Linux controller confirms remote cleanup.
gh_timeout_s=30
block_hours=4
block_max_hours=48
block_warn_minutes=15
claim_idle_minutes=15
claim_poll_seconds=60
