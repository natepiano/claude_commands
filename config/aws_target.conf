# The user approved go-live on 2026-11-03.
# one of: on, off
offload=on
host=aws-build
# one of: m7a.4xlarge
instance_type=m7a.4xlarge
region=us-east-2
credentials_profile=build-scaler
kinds=test,check,doc,lint,example,build

# SSH and retry limits, in seconds.
# range: 0.001..
connect_timeout_s=6
# range: 0.001..
probe_timeout_s=15
# range: 0.001..
unreachable_backoff_s=300
# range: 0.001..
capacity_backoff_s=300

# Storage and admission limits, in GiB.
# range: 0.001..
free_floor_gib=100
# range: 0.001..
build_budget_gib=32
# whole: 1..
slots=2
# whole: 1..
slots.hana=4
# whole: 1..
slots.cargo-liner=4
# range: 0.001..
target_budget_gib=24
# range: 0.001..
target_budget_gib.hana=32
skip.hana=
skip.cargo-liner=

# Start and idle controls.
# range: 0.001..
start_after_wait_s=120
# whole: 1..
start_min_waiting=2
# range: 0.001..
version_decline_hold_s=3600
# range: 0.001..
idle_stop_minutes=15

# The user sets these two limits. Change each value only on this line. Never raise these values in code.
# range: 0.001..
monthly_limit_usd=400
# range: 0.001..
daily_limit_usd=35
# one of: drain
limit_action=drain
# range: 0.001..
fixed_usd_per_month=76.21
# range: 0.001..
fallback_usd_per_hour=0.483

# Reserve spending capacity for a drain of at most 60 minutes.
# range: 0.001..
limit_reserve_usd=3
# range: 0.001..
drain_max_minutes=60

# Disable GitHub calls on this target.
ci_repo=

# Hold and claim settings. The Linux controller confirms remote cleanup.
# range: 0.001..
gh_timeout_s=30
# range: 0.001..
block_hours=4
# range: 0.001..
block_max_hours=48
# range: 0.001..
block_warn_minutes=15
# range: 0.001..
claim_idle_minutes=15
# range: 0.001..
claim_poll_seconds=60

# Linux shell inputs and public tool parity.
devshell=default
devshell.hana=ci
shell_cache=.local/state/build-target/shells
# range: 0.001..
shell_timeout_s=600
# range: 0.001..
leftover_timeout_s=10
# Empty pins compare each public version with the sender at use.
parity.rustc=
parity.nextest=
parity.mend=
# The version decline names this file so the user can move the box pins.
version_pin_file=nixos hosts/aws-build.nix
parity.scripts_commit=

# Cost evidence uses this zone for day and month boundaries.
accounting_zone=America/New_York
# whole: 1..
price_refresh_seconds=3600
# whole: 1..
price_max_age_seconds=7200
# whole: 1..
observation_max_age_seconds=300
# whole: 1..
cost_explorer_interval_seconds=86400
# Refresh recent UTC days because AWS can revise their charges.
# whole: 1..
cost_explorer_lookback_days=7
# range: 0..
cost_explorer_read_usd=0.01
# Charge each box for at least one minute.
# whole: 1..3600
box_minimum_seconds=60

# Components are included in fixed_usd_per_month, never added twice.
# range: 0..
retained_storage_usd_per_month=40
# range: 0..
root_storage_usd_per_month=2.56
# range: 0..
ipv4_usd_per_month=3.65
# range: 0..
gp3_iops_usd_per_month=15
# range: 0..
gp3_throughput_usd_per_month=15

# Limit events use the existing message interface.
notification_recipient=claude-natedev-builds
# whole: 1..
notification_timeout_s=30

# Minimum interval between limit notice attempts, in seconds.
# whole: 1..
notification_retry_s=300

# Lifecycle services remain disabled until the user gate.
# range: 0.001..
tick_interval_s=30
# range: 0.001..
controller_tick_timeout_s=900
# range: 0.001..
aws_timeout_s=30
# range: 0.001..
snapshot_max_age_s=60
# range: 0.001..
permission_ttl_s=90
# range: 0.001..
interruption_poll_s=5
# range: 0.001..
imds_timeout_s=2
remote_state_directory=.local/state/build-target/aws-control

# Deployment applies this resource tag. Cost Explorer reads the whole account.
cost_explorer_tag_key=BuildTarget
cost_explorer_tag_value=aws-build

# Deployment stays local until the user runs deploy.py apply.
deployment_profile=build-admin
stack_name=aws-build
ami_id=ami-07bfb1e3c271e2e69
ami_owner_id=427812963091
nixos_release=26.05
availability_zone=us-east-2c
vpc_id=vpc-02b2101974d585198
subnet_id=subnet-013611edfb0913d71
# The private file holds one address; the repo is public, so never put the address in a tracked file.
notification_email_file=~/.config/aws-build/notification-email
root_device_name=/dev/xvda
# whole: 1..
root_volume_gib=32
# whole: 500..500
data_volume_gib=500
# whole: 6000..6000
data_volume_iops=6000
# whole: 500..500
data_volume_throughput=500
# range: 0.001..
spot_max_usd_per_hour=0.483
# whole: 1..100
budget_notice_low_percent=50
# whole: 1..100
budget_notice_high_percent=80
# whole: 100..100
budget_stop_percent=100
# whole: 1..
deployment_timeout_s=900
# Limit each CloudFormation wait call.
# whole: 1..
stack_wait_timeout_s=3600
# whole: 1..
preflight_max_age_s=300
scaler_user_name=build-scaler
# deploy.py price writes the current public Spot price and its read time here; the file is state, outside the repository.
deployment_price_file=~/.config/aws-build/deployment-price
bootstrap_template_path=/etc/nixos/hosts/aws-bootstrap.sh.in
scripts_source_url=https://github.com/natepiano/claude_commands/archive/aeb936809630c8a539613d4b0def9dce0db040c0.tar.gz
scripts_source_sha256=sha256-w7EaA5hgfojThARQqaam11wPW0l8D93DELuWGnknMo0=
scripts_source_commit=aeb936809630c8a539613d4b0def9dce0db040c0
# Retry the new scaler key while IAM publishes its permissions.
# whole: 1..
scaler_key_check_attempts=12
# range: 0.001..
scaler_key_check_delay_s=5

# Encrypt administrator AWS and Tailscale credentials with one terminal passphrase.
admin_secret_file=~/.config/aws-build/admin.gpg
# The single-use join key expires quickly if the join fails.
# whole: 60..3600
tailscale_key_expiry_s=300
# Only this clean main checkout supplies the box configuration.
nixos_configuration_directory=/etc/nixos
# Bound the build, copy, and recovery hold; failure leaves a poweroff timer.
# whole: 60..7200
box_setup_timeout_s=3600
# Bound SSM and SSH recovery checks without an infinite retry.
# whole: 1..120
box_check_attempts=60
# Allow SSM registration and Tailscale restarts to settle between checks.
# range: 0.001..60
box_check_delay_s=5

# Extra seconds for the box to finish its idle stop.
# whole: 0..600
idle_stop_margin_s=120

# Gate trial limits. Read these values when each trial operation uses them.
# range: 0.001..
gate_trial_size_reserve_usd=4
# range: 0.001..
gate_trial_start_reserve_usd=3
# whole: 1..
gate_trial_lifetime_minutes=30
# whole: 1..604800
gate_trial_url_lifetime_s=7200
# range: 0.001..
gate_trial_target_gate_s=420
# Maximum seconds for each gate module, without reruns.
# range: 0.001..
gate_trial_module_limit_s=600
gate_trial_default_sizes=8,16,32,64
# whole: 1..
gate_trial_size_runs=3
# whole: 1..
gate_trial_start_runs=5
# range: 0.001..
gate_trial_poll_pause_s=2
# Seconds between uploads of the current guest logs.
# range: 0.001..
gate_trial_log_push_s=30
# range: 0.001..
gate_trial_group_delete_wait_s=120

# Seconds between deployment progress messages.
# range: 0.001..
deploy_progress_interval_s=60
