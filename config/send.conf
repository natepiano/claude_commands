# The native sender ID that grants Morty's authority mark.
MORTY_NATIVE_ID=codex:01a18dbb-7e8f-7641-b3dd-bb2071ab9d7a

# Owners for failed lookups from senders without a staff row.
failed_lookup_owners=aws-spending-guard=builds

# Push review budget in seconds.
# range: 0.001..
waits_review_seconds=30
# Default delivery budget in seconds.
# range: 0.001..
delivery_timeout=40
# Relay shutdown grace in seconds.
# range: 0.001..
kill_grace=10
# Emergency cancellation budget in seconds.
# range: 0.001..
user_cancel_timeout=30
# Emergency check budget in seconds.
# range: 0.001..
check_timeout=20

# Caller startup and result publication margin in seconds. Preserve the existing style caller margin.
# range: 0.001..
caller_margin_seconds=15

# Additional remote transport budget in seconds.
# range: 0.001..
remote_transport_seconds=30

# Decision deadlines within this many seconds can ring High.
# range: 0.001..
decision_high_priority_window_seconds=1800

# Main sync notification repeat window in minutes.
# range: 0.001..
main_sync_repeat_minutes=360
