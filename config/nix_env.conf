# Limit each direnv or Git proof command.
# range: 0.001..
command_timeout_seconds=600

# Select home folders that permit automatic approval.
# text: space-separated folders
trusted_home_folders=rust worktrees

# Permit automatic approval under home folders with this prefix.
# text: nonempty prefix
trusted_home_prefix=.claude

# Select the healer journal folder.
# text: nonempty path
heal_state_directory=~/.local/state/nix-heal

# Select session folders below the home folder.
# text: nonempty glob
session_directory_glob=.claude*/sessions

# Limit repeated healer restarts to one hour (60 * 60 seconds).
# range: 0..
restart_interval_seconds=3600

# Allow herdr to launch the replacement session.
# range: 0..
relaunch_launch_seconds=90

# Allow command start and record confirmation after launch.
# range: 0..
relaunch_confirmation_seconds=30

# Limit each healer alert command.
# range: 0.001..
alert_timeout_seconds=30
