# Keep indexes from other schemas for inactive trees.
# Basis: user 2026-11-04: no opinion; the showrunner chose 2, because read-only paths do not stamp mtime and relatime moves atime at most once a day.
# range: 0..
INDEX_UNUSED_DAYS=2

# Refresh the current index timestamp after this many minutes.
# Basis: record checkout use each hour without a write on every update; keep it well below INDEX_UNUSED_DAYS.
# range: 0..
INDEX_TOUCH_MINUTES=60

# Rank costs over this many recent days.
# Basis: Use two days so older costs do not hide recent changes.
# whole: 1..
TOP_COST_RECENT_DAYS=2

# Show this action for memory wait.
# Basis: The build page names an action for each cost.
# text:
COST_ACTION_MEMORY_WAIT=Lower the memory peaks of the steps that wait most.

# Show this owner for memory wait.
# Basis: The build page names the owner of each action.
# text:
COST_OWNER_MEMORY_WAIT=queue-unit

# Show this action for cold rebuilds.
# Basis: The build page names an action for each cost.
# text:
COST_ACTION_COLD_REBUILDS=Keep warm build folders for the checkouts that rebuild most.

# Show this owner for cold rebuilds.
# Basis: The build page names the owner of each action.
# text:
COST_OWNER_COLD_REBUILDS=resources-unit

# Show this action for reruns after a pass.
# Basis: The build page names an action for each cost.
# text:
COST_ACTION_RERUNS_AFTER_A_PASS=Do not run tests again on a tree that already passed.

# Show this owner for reruns after a pass.
# Basis: The build page names the owner of each action.
# text:
COST_OWNER_RERUNS_AFTER_A_PASS=sdlc

# Show this action for failed runs.
# Basis: The build page names an action for each cost.
# text:
COST_ACTION_FAILED_RUNS=Fix each visible failure before the next run.

# Show this owner for failed runs.
# Basis: The build page names the owner of each action.
# text:
COST_OWNER_FAILED_RUNS=the unit that ran the step

# Show this action for cancelled CI.
# Basis: The build page names an action for each cost.
# text:
COST_ACTION_CANCELLED_CI=Push once a checkpoint is ready, so a later push does not cancel CI.

# Show this owner for cancelled CI.
# Basis: The build page names the owner of each action.
# text:
COST_OWNER_CANCELLED_CI=builds

# Show this action for Mac idle while natedev waits.
# Basis: The build page names an action for each cost.
# text:
COST_ACTION_MAC_IDLE_WHILE_NATEDEV_WAITS=Send waiting tests to the free Mac.

# Show this owner for Mac idle while natedev waits.
# Basis: The build page names the owner of each action.
# text:
COST_OWNER_MAC_IDLE_WHILE_NATEDEV_WAITS=builds

# Set the cache spill threshold in pages.
# Basis: WAL spill starts at 65,536 changed pages (256 MiB with 4096-byte pages).
# Explicit ON keeps this threshold enabled when SQLite reads the number as an 8-bit boolean.
# WAL rebuild, 2026-11-08: peak RSS 1,386,436 KiB; 240.09 s wall; load 108.2 to 61.3.
# whole: 1..
INDEX_SPILL_PAGES=65536

# Wait this many seconds for each index during selection.
# Basis: Selection can try another index; reads of the selected index use the database timeout.
# range: 0..
INDEX_READ_WAIT_SECONDS=1
