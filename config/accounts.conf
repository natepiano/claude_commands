# Age limit for usage readings and peer session counts.
# whole: 1..
usage_stale_minutes=10

# Time limit for a quota alert relay, before the delivery budget adds its grace.
# whole: 1..
quota_relay_timeout_seconds=40

# Time limit for a quota alert registry editor.
# whole: 1..
quota_edit_timeout_seconds=30

# Director notices when Codex workers lose capacity and recover.
no_worker_mode_on=Codex workers have no capacity. Send no assign. Do your current work yourself: write the code, run the tests and do the reviews directly. Keep to this rule until the workers-back notice arrives.
no_worker_mode_off=Codex workers are up again. Use workers again. This notice ends no-worker mode.

# Time limit for an account command.
# whole: 1..
account_command_timeout_seconds=15

# Time limit for a Claude usage HTTP request.
# whole: 1..
claude_usage_timeout_seconds=15

# Time limit for a Codex account server to stop after termination.
# whole: 1..
codex_close_timeout_seconds=3

# Time limit for the local Codex version read.
# whole: 1..
codex_version_timeout_seconds=15

# Time limit for a peer Codex update and version read.
# whole: 1..
codex_update_timeout_seconds=600

# Time limit for a Claude login probe.
# whole: 1..
login_probe_timeout_seconds=120

# Working folder for a Claude login probe.
login_probe_directory=/tmp

# Age before account setup removes an old temporary file.
# whole: 1..
temporary_file_age_days=1

# Maximum move entries in the status detail.
# whole: 1..
move_status_count=10

# Numerator divided by points per hour for a half-point hold.
# whole: 1..
half_point_pace_minutes=30

# Hold duration when no usable pace exists.
# whole: 1..
hold_default_minutes=40

# Time limit for a role map command.
# whole: 1..
role_map_timeout_seconds=20

# Read size while searching a transcript from its end.
# whole: 1..
transcript_chunk_bytes=65536

# Maximum reset delay that makes a refused session wait.
# whole: 1..
refusal_reset_wait_minutes=20

# Minimum interval between login renewal attempts.
# whole: 1..
login_renewal_interval_minutes=60

# Claim lease; fifteen minutes exceeds all send deadlines.
# whole: 1..
outage_claim_lease_seconds=900

# System repository checked for the account alias module.
nixos_repository_root=/etc/nixos

# Default folder for account notes; HOME expands the leading tilde.
notes_directory=~/rust/hanadocs/agents

# Home repository checked after the system repository.
home_nixos_repository_root=~/nixos

# Machine that sends preventive login reminders.
login_sitting_machine=natedev

# First weekly login sitting, with its time zone offset.
login_sitting_first=2026-11-17T10:00:00-05:00

# Days between login sittings.
# whole: 1..
login_sitting_interval_days=7

# Days after a sitting that select accounts for renewal.
# whole: 1..
login_sitting_window_days=10

# Days before a login ends that require a safety reminder.
# whole: 1..
login_safety_margin_days=3

# Minutes between attempts to read peer login dates.
# whole: 1..
login_peer_read_minutes=60

# Time limit for the peer account status command.
# whole: 1..
login_peer_read_timeout_seconds=30
