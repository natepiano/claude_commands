# Two standing gate checkouts per owner/repository; the count is fixed.
# Read with scripts/lint/config_values.py; required settings have no code defaults.
[copies]
# Required absolute root after expanding ~.
root=~/worktrees/gates
# Required positive, finite secondary-checkout recheck interval in seconds.
# Primary-checkout release wakes acquisition immediately through its busy flock.
wait_seconds=1
# Required positive, finite deadlines in seconds for Git steps and the guard.
git_timeout_seconds=600
guard_timeout_seconds=10
# Required only when the respective caller needs a fallback owner.
owner.nightly=nightly
owner.style=style
owner.verify=verify

# Paths are relative to scripts/. Reasons document each original/mirror exception.
[allow-list]
allow.copies/copies.py=The one implementation of standing gate checkouts.
allow.production/add_unit.py=Creates the original unit worktree.
allow.shutdown/shutdown.py=Restores the original unit worktree.
allow.berth_fix/launch.sh=Creates a standing original fixer worktree, not a build copy.
allow.style/add_style.py=Creates a unit's original checkout, like add_unit.py.
allow.bevy_migration_plan/bevy_migration_ensure_repo.sh=Clones external upstream at a version, not a copy of our work.
allow.worktree/make_worktree.sh=Makes an original work worktree, not a build copy.
