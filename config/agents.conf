# Global agent registry, resolved by scripts/agents/agents_config.sh.
#
# [assignments] selects a family; each [<function>.<family>] section selects an
# agent and optional effort per subtask; [<family>.agents] validates each row.
# A [<function>.options] section holds that function's launch flags — not agent
# rows, and not read by agents_resolve; its consumer reads the key it owns.
# scripts/agents/sync_codex_catalog.sh refreshes only [codex.agents] from the
# Codex config and models cache. [claude.agents] is hand-maintained.
#
# Consumers, all through agents_resolve/agent_exec:
#   - delegate implementation and review
#   - CLI aliases
#   - fix pipeline stages and report
#   - ask_a_friend
#   - team_review, api_review, and module_review
#
# An empty effort uses the agent CLI default.

# ── major function → family: the switch ──
[assignments]
delegate=codex
cli=codex
fix=codex
ask_a_friend=codex
team_review=codex
api_review=codex
module_review=codex

# ── delegate (/plan:delegate) ──
# One vocabulary: a task names the kind of work, and there are four kinds. The
# retired keys — architect, mechanical, escalation — named how hard an agent to
# send, not what it was doing, so this list answered two questions at once and
# neither axis could be read off a key. The tier axis is gone: an escalated
# pass is `impl`, a trivial repair is `fix`, an architecture review is `review`.
[delegate.codex]
impl=gpt-5.6-sol:xhigh
test=gpt-5.6-sol:xhigh
fix=gpt-5.6-sol:xhigh
review=gpt-5.6-sol:max

[delegate.claude]
impl=opus:high
test=opus:high
fix=opus:high
review=opus:xhigh

# A codex delegate runs as a thread on one `codex app-server` per session, so
# peers and the orchestrator can message and interrupt it mid-run the way they
# already can a claude delegate. Set codex_mesh=0 and it runs instead as its own
# `codex exec` process, which nothing outside that process can address — same
# model, same effort, same sandbox, but the delegate has no address and the
# board log is then the only channel it has.
# Env PLAN_DELEGATE_CODEX_MESH overrides this for a single run.
[delegate.options]
codex_mesh=1

# ── cli (~/.zshrc aliases via scripts/cli_agent/cli_agent.sh) ──
[cli.codex]
style_fix_review=gpt-5.6-luna:high    # alias: review
commit_prep=gpt-5.6-luna:high         # aliases: commit_no, commit_yes
merge_branch=gpt-5.6-luna:high        # alias: merge
interactive=gpt-5.6-sol:high         # alias: code (REPL)

[cli.claude]
style_fix_review=opus:high
commit_prep=sonnet:high
merge_branch=sonnet:high
interactive=opus:max

# ── fix (launchd style pipeline) ──
[fix.codex]
style_eval=gpt-5.6-sol:max
style_eval_review=gpt-5.6-sol:xhigh
style_fix=gpt-5.6-sol:xhigh
report=gpt-5.6-sol:medium

[fix.claude]
style_eval=opus:max
style_eval_review=opus:max
style_fix=opus:max
report=sonnet:medium

# ── ask_a_friend ──
[ask_a_friend.codex]
consultation=gpt-5.6-sol:max
implementation=gpt-5.6-sol:xhigh

[ask_a_friend.claude]
consultation=fable:max
implementation=opus:max

# ── review commands (/team_review, /api_review, /module_review) ──
[team_review.codex]
expert=gpt-5.6-sol:xhigh          # 3-5 parallel dimension reviewers

[team_review.claude]
expert=opus:xhigh

[api_review.codex]
reviewer=gpt-5.6-sol:high        # 5 parallel inventory/finding agents
adversary=gpt-5.6-sol:high       # 2 stress-test agents

[api_review.claude]
reviewer=opus:max
adversary=opus:max

[module_review.codex]
reviewer=gpt-5.6-sol:high        # pass 1 structure + pass 2 over-large files
validation=gpt-5.6-sol:medium    # pass 3 doc-vs-code validation

[module_review.claude]
reviewer=opus:max
validation=sonnet:medium

# ── validation catalogs: agent=comma-separated valid efforts ──
[codex.agents]
# Generated by scripts/agents/sync_codex_catalog.sh — do not hand-edit.
gpt-5.6-sol=low,medium,high,xhigh,max,ultra
gpt-5.6-terra=low,medium,high,xhigh,max,ultra
gpt-5.6-luna=low,medium,high,xhigh,max
gpt-5.5=low,medium,high,xhigh
gpt-5.4=low,medium,high,xhigh
gpt-5.4-mini=low,medium,high,xhigh
gpt-5.3-codex-spark=low,medium,high,xhigh

[claude.agents]
# Hand-maintained. Claude agent names are the CLI's short aliases.
fable=low,medium,high,xhigh,max
opus=low,medium,high,xhigh,max
sonnet=low,medium,high,xhigh,max
