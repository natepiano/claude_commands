# Dailies counts use <staff id>.<label> keys from the staff record.
# The builder reads this file for each report. Changes apply to the next report.
#
#   <staff id>.<label>=lines <file> <regex>
#   <staff id>.<label>=files <glob>
#   <staff id>.<label>=issues <folder> <tag>
#
# A hyphen in a label becomes a space. `~` expands to the home folder.
# Missing sources show `not found`. Invalid lines suppress the counts line.
# User 2026-10-10: keep nightly queue length and proposal count.

# natedev
96b016bf-87cf-4a19-af7a-77425852c2e2.nightly-queue=lines ~/.local/state/nightly-review/ledger.md — (proposed|deferred)$
96b016bf-87cf-4a19-af7a-77425852c2e2.proposals=lines ~/.local/state/plan-backlog/ledger.md — (proposed|deferred)$

# hana, on the Mac
439f9cfc-4aef-41ce-931a-c7abac39327e.proposals=issues ~/rust/hanadocs/issues proposal
