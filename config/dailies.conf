# Counts each production's dailies show on one line above the chart, in every
# length: `counts: nightly queue 8 · proposals 3`. Read by
# scripts/production/dailies_counts.py when the dailies input is built, so an
# edit applies to the next dailies with nothing to restart.
#
#   <production slug>.<label>=lines <file> <regex>   lines of the file matching the regex
#   <production slug>.<label>=files <glob>           files matching the glob
#   <production slug>.<label>=issues <folder> <tag>  open issues directly in the folder with the tag
#
# The slug is the production doc's file name less `-production.md`. `~`
# expands, and a hyphen in the label reads as a space. A missing file or folder
# shows as `not found`; a bad line leaves the counts out and the builder says why.
# User 2026-10-10: nightly queue length and proposal count.

# natedev
build-followups.nightly-queue=lines ~/.local/state/nightly-review/ledger.md — (proposed|deferred)$
build-followups.proposals=lines ~/.local/state/plan-backlog/ledger.md — (proposed|deferred)$

# hana, on the Mac
tool-based-ui.proposals=issues ~/rust/hanadocs/issues proposal
