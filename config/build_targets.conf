# Machines that can run build jobs, in the order a job tries them.
targets=mac,natedev,aws
kind.natedev=local
platform.natedev=linux
kind.mac=ssh
platform.mac=macos
settings.mac=mac_test.conf
kind.aws=ssh
platform.aws=linux
settings.aws=aws_target.conf

# Host names in synchronized records.
sync.hosts.natedev=natedev
sync.hosts.mac=Mac,Nates-MacBook-Pro-2023,mac,macbook
sync.hosts.aws=aws-build
sync.connect_timeout_s=10
sync.reach_timeout_s=30
sync.rsync_timeout_s=600

# Production that receives vault stop questions.
vault.question_production=natedev
# Extra tries after a busy vault index lock.
# whole: 0..10
vault.lock_retries=5
# Seconds between tries after a busy vault index lock.
# range: 0..5
vault.lock_retry_delay_s=3

# Manual Linux proof. This target does not enter the active target list.
loopback.host=natedev
loopback.port=
loopback.known_hosts=
loopback.connect_timeout_s=6
loopback.probe_timeout_s=30
loopback.command_timeout_s=600
loopback.free_floor_gib=1
# The gate uses its fallback estimate before the fixture has history.
loopback.build_budget_gib=16
loopback.target_budget_gib=1
loopback.shell_timeout_s=120
loopback.shell=default
loopback.memory_gib=16
