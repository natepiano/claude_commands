# /unit:direct tuning — the convergence limits that decide when a phase's
# progress gets remarked on to the user, plus the progress-report interval.
#
# The convergence limits are read by scripts/direct/findings.py at startup, so
# an edit applies to the next `findings.py gate` with nothing to restart. Every
# one is a whole number of rounds or attempts except REPAIR_ROUNDS_PER_FINDING,
# which is a rate. This file is authoritative: findings.py carries no defaults,
# so a missing key, a non-numeric value, or a value below its minimum makes it
# print every problem it found and exit 2 before running any command.
#
# ROUTING_FROM_ROUND and ASTRA_AFTER_FAILED_FIXES enforce repair evidence.
# The other limits below keep their advisory meaning.
#
# `findings.py gate` never stops the run: it answers `converged` or `dispatch`,
# and the first condition below that trips names itself in the verdict's
# `advisory` string while the round dispatches anyway. Each advisory limit sets
# when a sentence gets said, not when work halts — the user reads it and decides.

# Floor on the per-phase repair budget. Every phase gets at least this many
# automatic fix rounds no matter how few findings the first round opened.
# whole: 1..
MIN_REPAIR_BUDGET=3

# Rounds bought per gating finding counted on the first round: 8 findings buy a
# 4-round budget, and the floor above applies when the product is smaller.
# Repairs dispatch one batch per round, so N findings should close in about N/2
# rounds; a phase that needs materially more is bleeding rather than
# converging. Must be greater than 0.
# range: 5e-324..
REPAIR_ROUNDS_PER_FINDING=0.5

# Hard ceiling on fix rounds per phase, whatever the budget computes to.
# whole: 1..
RUNAWAY_ROUNDS=5

# Report when one finding has failed to close this many times.
# whole: 1..
MAX_FIX_ATTEMPTS=2

# Report when one finding has been reopened this many times after being accepted.
# whole: 1..
MAX_REOPENS=2

# Report when the gating open count has not decreased across this many
# consecutive rounds.
# whole: 1..
STALLED_ROUNDS=2

# Report after this many consecutive passes of the same kind inside one phase.
# whole: 1..
MAX_CONSECUTIVE_SAME_KIND_PASSES=3

# Blind reviews that <DualReview/> may preempt per phase before the gate
# concludes the broad review is never completing.
# whole: 0..
MAX_REVIEW_CANCELLATIONS=1

# Seconds a Codex unit director waits per poll of a running dispatch, per
# <CodexDispatchWait/> in docs/direct/codex_dispatch_wait.md; Codex requires a positive integer.
# User 2026-10-10: one hour. Reports come only when asked (2026-10-19), so no timer
# reads it.
# whole: 1..
UNIT_PROGRESS_INTERVAL_SECONDS=3600

# Compact an idle Codex worker before new work above this recorded context size.
# whole: 1..
UNIT_COMPACT_ABOVE_TOKENS=100000

# Compact an ad hoc Astra reviewer above this recorded context size.
# whole: 1..
ASTRA_REVIEW_COMPACT_ABOVE_TOKENS=200000

# Seconds to wait for a Claude worker's session record after the background banner.
# whole: 1..300
CLAUDE_WORKER_REGISTER_WAIT_SECS=30

# Seconds between Claude worker state reads.
# range: 0..
CLAUDE_WORKER_POLL_SECS=15

# Require kept-category evidence from this repair interval (the user, 2026-10-28).
# whole: 1..
ROUTING_FROM_ROUND=4

# Require an Astra approach after this many failed fixes (the user, 2026-10-28).
# whole: 1..
ASTRA_AFTER_FAILED_FIXES=2

# Switch the daily four-agent simplify run.
# one of: on, off
SIMPLIFY_LENS=off

# The first run starts at this time, the hard stop of the lens in each phase.
SIMPLIFY_FIRST_RUN_BEFORE=2026-11-05T22:50:00-05:00

# Name the simplify agents and require each agent to complete.
SIMPLIFY_AGENTS=reuse simplification efficiency altitude

# Share of the parent pane retained by a worker split.
# range: 0.1..0.9
WORKER_SPLIT_RATIO=0.667

# First turn for a fresh Codex worker before staff publication.
WORKER_FIRST_TURN_TEXT=Reply with ready. Do not use tools.

# Seconds available for the first Codex turn.
# range: 1..600
WORKER_FIRST_TURN_SECONDS=120

# Seconds a working pane has to settle before a dispatch reports it busy.
# range: 1..600
WORKER_SETTLE_SECONDS=30

# Seconds available for a pane agent to start.
# range: 1..600
PANE_AGENT_START_SECONDS=90

# Pin this transport when a run first selects its workers.
# one of: mesh, herdr
WORKER_TRANSPORT=herdr

# Seconds in each verify cargo token lease.
# whole: 1..
VERIFY_TOKEN_HOLD_SECONDS=3600

# Seconds between renewals. Verify limits this value to one third of the lease.
# whole: 1..
VERIFY_TOKEN_RENEW_SECONDS=60

# Maximum guard attempts for a token release or renewal.
# whole: 1..
TOKEN_GUARD_ATTEMPTS=200

# Milliseconds between token guard attempts.
# whole: 1..
TOKEN_GUARD_DELAY_MS=50

# Test result keys include these exported names. Unset and empty values differ.
# text: space-separated variable names
VERIFY_RESULT_ENV_NAMES=NO_COLOR CLICOLOR CLICOLOR_FORCE FORCE_COLOR CI TZ LANG LC_ALL LC_COLLATE LC_CTYPE LC_MESSAGES LC_MONETARY LC_NUMERIC LC_TIME LC_ADDRESS LC_IDENTIFICATION LC_MEASUREMENT LC_NAME LC_PAPER LC_TELEPHONE

# Test result keys include exported names with these prefixes.
# text: space-separated variable prefixes
VERIFY_RESULT_ENV_PREFIXES=HANA_ WGPU_ BEVY_ INSTA_ TRACE_

# Each test uses these terminal values on every target.
# text: space-separated NAME=value assignments
VERIFY_TEST_FIXED_ENV=TERM=xterm-256color COLORTERM=truecolor TERM_PROGRAM=verify COLUMNS=80 LINES=24
