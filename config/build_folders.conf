# Build folder settings. Readers use current values for each allocation.
[names]
# whole: 1..
names.suffix_length=8
# whole: 1..64
names.repository_key_length=8
names.suffix_characters=abcdefghijklmnopqrstuvwxyz0123456789_

[roots]
roots.system=/tmp
roots.temporary=${TMPDIR}/builds
roots.gate=/dev/shm
roots.copies=/tmp/claude/copies
roots.workspace=~/worktrees
roots.mirror=~/rust/mirrors
roots.shell=~/rust/shells

[patterns]
patterns.temporary={repository}/{owner}-{purpose}-{suffix}
patterns.gate={purpose}-{suffix}
patterns.standing={repository}/{owner}-gate{suffix}
patterns.editable={repository}-{owner}/{purpose}
patterns.mirror={repository}/{owner}-s{slot}
patterns.target={purpose}
patterns.shell-cache={repository}
patterns.scratch={purpose}-{suffix}
patterns.legacy-unique={purpose}{suffix}
patterns.legacy-stable={purpose}

[prefixes]
prefixes.merge-gate=merge-gate-
prefixes.merge-gate-module={owner}-
prefixes.merge-gate-nightly=merge-gate-nightly-
prefixes.promotion-index=promotion-index-
prefixes.fast-track-index=fast-track-index-
prefixes.fast-track-check=fast-track-check-
prefixes.fast-track-restore-index=fast-track-restore-index-
prefixes.fast-track-promote=fast-track-promote-
prefixes.fast-track=fast-track-
prefixes.production-scratch=production-scratch-
prefixes.bump-gate=bump-gate-
prefixes.ci-point=ci-point-
prefixes.bulk-rule-test=bulk-rule-test-
prefixes.style-sync-lint=style-sync-lint-
prefixes.rust-release-trial=rust-release-trial-{owner}
prefixes.verify-tree=verify-tree.{owner}.
prefixes.copies-index=copies-index-
prefixes.verify-copy=verify-copy.{owner}.
prefixes.verify-hold=verify-hold.{owner}.
prefixes.queue-place=queue-place-
prefixes.admit-test=admit-test-
prefixes.admit-sock=admit-sock-
prefixes.copy-watch=copy-watch.
prefixes.linux-cache-stage=.{owner}.
prefixes.linux-step=.linux-step-
prefixes.style-review={owner}-
prefixes.checkpoint-doc=checkpoint-doc-
prefixes.checkpoint-paths=checkpoint-paths-
