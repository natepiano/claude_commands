# All deadlines stay at or below the former notes job's 120-second limit.
[job]
interval_seconds = 120
timeout_seconds = 120

[mac_usage]
interval_seconds = 60

[parts.notes]
interval_seconds = 120
timeout_seconds = 60
[parts.quota]
interval_seconds = 120
timeout_seconds = 30
[parts.pacer]
interval_seconds = 120
timeout_seconds = 30
[parts.refusals]
interval_seconds = 120
timeout_seconds = 60
[parts.watchdog]
interval_seconds = 120
timeout_seconds = 45
[parts.prune]
interval_seconds = 120
timeout_seconds = 60
[parts.hierarchy]
interval_seconds = 120
timeout_seconds = 60
[parts.vault]
interval_seconds = 120
timeout_seconds = 60

[hierarchy]
git_seconds = 30
read_seconds = 60
[vault]
git_seconds = 30
named_paths = 4

[watchdog]
dispatch_seconds = 5
recovery_seconds = 240
pass_dispatch_seconds = 30
result_seconds = 300
