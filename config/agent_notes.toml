# All deadlines stay at or below the former notes job's 120-second limit.
[job]
interval_seconds = 120
timeout_seconds = 120

[mac_usage]
# 60 s drew HTTP 429 that moved between the four Claude accounts (2026-11-01).
interval_seconds = 120

[parts.notes]
interval_seconds = 120
timeout_seconds = 60
[parts.quota]
interval_seconds = 120
timeout_seconds = 30
[parts.pacer]
interval_seconds = 120
timeout_seconds = 30
[parts.refusals]
interval_seconds = 120
timeout_seconds = 60
[parts.watchdog]
interval_seconds = 120
timeout_seconds = 45
[parts.logins]
interval_seconds = 120
timeout_seconds = 45
[parts.prune]
interval_seconds = 120
timeout_seconds = 60
[parts.vault]
interval_seconds = 120
timeout_seconds = 60

[vault]
git_seconds = 30
named_paths = 4

[watchdog]
dispatch_seconds = 5
recovery_seconds = 240
pass_dispatch_seconds = 30
result_seconds = 300
