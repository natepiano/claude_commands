# Settings for scratch. Read through scripts/lib/conf.py.

# Resource settings. Values retain the existing behavior.

# Root for visible scratch folders.
visible_root=~/rust/repro

# File that records scratch holds.
holds_file=~/.local/state/scratch/holds.json

# Lifetime of a scratch folder without an explicit task.
# whole: 1..
default_life_seconds=86400

# Maximum folder depth for the repository scan.
# whole: 1..
repo_depth=3

# Number of random characters in a scratch folder name.
# whole: 1..
suffix_length=6

# Folder names excluded from repository scans.
repo_skip=target node_modules .git

# Maximum attempts to lock a changing copy folder.
# whole: 1..
record_lock_attempts=3
