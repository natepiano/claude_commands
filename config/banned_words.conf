# Banned-word hook enforcement — on or off.
#
# Read by hooks_enabled() in scripts/hooks/banned_words_lib.py, which both
# banned-word hooks call before they scan anything. Their registration in
# settings.json is permanent, so this file is the only thing that turns
# enforcement on and off and a flip never rewrites settings.json.
#
# Use /banned_word_hook on|off to change it, /banned_word_hook status to read
# it. Editing this line by hand works too; the hooks re-read the file on every
# invocation, so a change takes effect immediately with no restart.
#
# Only a literal `off` disables enforcement. A missing file, an unreadable one,
# or any other value means on.
#
# The two hooks this governs:
#   PostToolUse  post-tool-use-banned-words.py        blocks and messages the violation
#   Stop         stop-assistant-prose-banned-words.py scans the emitted turn

[hooks]
enabled=on
