# Message delivery settings. Read each setting when delivery starts.
# whole: 1..20
delivery_tries=3
# Pause between message delivery attempts.
# range: 0..300
delivery_pause_seconds=5

# Set the height of each feedback box in rows.
# whole: 1..20
feedback_rows=5

# The showrunner receives alerts for unresolved staff conflicts.
# The showrunner also takes changes whose production document is gone.
# text: nonempty name
unrouted_alert_recipient=natedev
# Delay repeated alerts after an unsuccessful send.
# range: 5..3600
unrouted_alert_retry_seconds=60

# The server and published URLs use this port.
# whole: 1..65535
server_port=8765

# Limit each Tailscale address command.
# range: 0.001..
tailscale_timeout_seconds=10

# Remove snapshots older than seven days (7 * 24 * 60 * 60 seconds).
# range: 0..
snapshot_retention_seconds=604800

# Limit the interval between snapshot sweeps to one hour (60 * 60 seconds).
# range: 0.001..
snapshot_sweep_seconds=3600

# Limit the interval between address checks.
# range: 0.001..
tailscale_check_seconds=60

# Limit the interval between loaded module checks.
# range: 0.001..
code_check_seconds=5

# Limit attempts to allocate a snapshot folder.
# whole: 1..
snapshot_allocation_tries=10
