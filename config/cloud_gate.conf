# Try the home region before the fallback region.
regions=us-east-2 us-west-2 eu-north-1 eu-south-2
# Spot work and later price steering use these candidate regions.
spot_candidate_regions=us-east-2 us-west-2
# Request enough Spot vCPUs for four gates with 32 vCPUs each.
# whole: 1..10000000000
spot_quota_request_vcpus=128
# Request enough G and VT Spot vCPUs for one GPU box up to 8xlarge.
# whole: 1..10000000000
gpu_spot_quota_request_vcpus=32
# Read Spot prices for these GPU types.
gpu_instance_types=g6.xlarge g4dn.xlarge g4ad.xlarge g5.xlarge
# Try recently refused capacity only after the other variants.
# whole: 1..86400
capacity_cooldown_seconds=1800
# Median transfer bytes cost $0.00014215344 at $0.02 per GB; round upward.
# range: 0..1
remote_region_transfer_usd=0.00015
# Preferred Spot size, followed by the capacity fallback size.
instance_types=m7a.8xlarge c7a.8xlarge m7a.4xlarge
# The box clones public history before it fetches the incremental bundle.
clone_url=https://github.com/natepiano/claude_commands.git
# Prefix for temporary branches that paired trials push and delete.
trial_branch_prefix=gate-trial
# Bound network Git calls so stalled connections cannot block trial cleanup.
# range: 0.01..300
git_network_timeout_s=60
# The queue limits concurrent cloud gates.
# whole: 1..9
slots=9
# Maximum charged lifetime, including preparation and result delivery.
# whole: 1..60
lifetime_minutes=20
# whole: 1..500
root_gib=40
# range: 0.01..10
spot_max_usd_per_hour=0.8
# Include root storage, public IPv4, and object transfers in each reservation.
# range: 0..1
attempt_allowance_usd=0.02
# range: 1..60
log_push_s=5
# range: 0.1..60
result_poll_s=2
# Repeat an uncertain launch with its saved idempotency token.
# whole: 1..5
launch_reply_tries=2
# range: 1..120
api_timeout_s=30
# range: 1..600
termination_timeout_s=120
# range: 1..3600
module_time_limit_s=1800
# whole: 1..365
artifact_days=7
# CloudWatch accepts the retention periods in the deployment schema.
# whole: 1..365
log_days=7
# whole: 1..60
expiry_schedule_minutes=1
# whole: 1..60
expiry_timeout_s=30
# whole: 128..10240
expiry_memory_mib=128
# Price shared object storage, expiry calls, and logs before deployment.
# range: 0..100
shared_usd_per_month=1
# The service uses only the scaler profile from aws_target.conf.
credential_file=~/.config/aws-build/credentials
# Tool preparation uses the deployment host's locked nixpkgs revision.
packages=git python3 cargo rustc rustup cargo-nextest uv curl openssh rsync gnupg ripgrep jq gcc pkg-config tmux taplo zsh bash gh sqlite chromium nodejs util-linux
