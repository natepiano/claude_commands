# Select the state base when XDG_STATE_HOME is unset.
# text: nonempty path
state_directory=~/.local/state

# Select the nightly folder within the state base.
# text: nonempty folder
state_folder=nightly-review

# Select the session records folder.
# text: nonempty path
sessions_directory=~/.claude/sessions

# Select review modes in execution order.
# text: space-separated modes
review_modes=config rust messages

# Limit the sampled transcript messages.
# whole: 1..
message_sample_rows=20

# Allow 15 seconds beyond message_sample_rows * the configured message review budget.
# range: 0..
sample_timeout_overhead_seconds=15

# Limit the message review history interval.
# range: 0..
message_history_hours=24

# Limit each candidate table cell.
# whole: 1..
title_characters=90

# Select the candidate note.
# text: nonempty path
note_path=~/rust/hanadocs/nightly improvement list.md

# Include this showrunner when its timer is not registered.
# text: nonempty name
primary_showrunner_name=natedev

# Select the command document for the nightly job.
# text: nonempty path
command_path=~/.claude/commands/nightly_review.md
