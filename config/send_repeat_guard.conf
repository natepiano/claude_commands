# Seconds of inactivity before a receiver counter and its notification episode expire.
window_seconds=1800
# Hold this copy and subsequent copies to the same receiver.
repeat_count=3
# Notify the owner after this many messages from one sender to one receiver in a window.
receiver_rate_count=100
# Maximum sender records retained on one machine.
max_senders=4096
# Maximum receiver and literal-text records per sender.
max_keys=256
# Maximum characters retained for the literal-text preview.
preview_characters=240
# Seconds allowed for a notice delivery by the background drain.
notice_timeout_seconds=60
# Whole detached drain lifetime; its cursor advances before each sender attempt.
drain_timeout_seconds=90

# Maximum seconds an unfinished owner notice survives, independent of counter expiry.
notice_max_age_seconds=86400
