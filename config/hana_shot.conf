# Settings for hana_shot. Read through scripts/lib/conf.py.

# Resource settings. Values retain the existing behavior.

# Port reserved for the user Hana.
# whole: 1..
refused_port=15702

# Local address for BRP calls.
host=127.0.0.1

# Maximum time for a BRP call.
# range: 0..
call_timeout_seconds=10.0

# Maximum time for a screenshot capture.
# range: 0..
capture_timeout_seconds=30.0

# Maximum time to copy a screenshot.
# range: 0..
copy_timeout_seconds=60.0

# Maximum time for the camera to become stable.
# range: 0..
settle_seconds=5.0

# Frames required when the camera does not move.
# whole: 1..
unchanged_frames=3

# Frames required after a window change.
# whole: 1..
window_frames=2

# Maximum interval for a capture retry.
# range: 0..
resend_seconds=2.0

# Maximum time for a setup target to appear.
# range: 0..
setup_seconds=5.0

# Maximum time for the ready log line.
# range: 0..
ready_seconds=180.0

# Maximum frame time before a capture.
# range: 0..
warm_frame_ms=50.0

# Maximum time to wait for warm frames.
# range: 0..
warm_seconds=30.0

# Maximum pixel value treated as a black capture.
# range: 0..
black_maximum=0.02

# Maximum clear viewport fraction on each side.
# range: 0..
max_margin=0.45

# Maximum retained screenshot bytes.
# whole: 1..
shot_directory_bytes=1073741824

# Maximum age of a retained screenshot.
# whole: 1..
max_age_seconds=604800

# Maximum concurrent capture operations.
# whole: 1..
workers=6

# Maximum remote display wake time.
# whole: 1..
remote_awake_seconds=3600

# Maximum local display wake time.
# whole: 1..
local_awake_seconds=30

# Minimum delay between frame samples.
# range: 0..
minimum_frame_seconds=0.005

# Frame time when diagnostics have no value.
# range: 0..
default_frame_ms=16.0

# Viewport margin change for a fit probe.
# range: 0..
margin_probe=0.05

# Maximum selector suggestions.
# whole: 1..
selector_suggestions=5

# Maximum time for a Git identity query.
# range: 0..
git_timeout_seconds=5

# Maximum time to inspect uncommitted build paths.
# range: 0..
git_status_seconds=3

# Maximum time for a port probe.
# range: 0..
port_probe_seconds=0.5

# Delay between process readiness checks.
# range: 0..
poll_seconds=0.1

# Maximum time for the shutdown BRP call.
# range: 0..
shutdown_call_seconds=5

# Maximum time to wait for a Hana exit.
# range: 0..
shutdown_seconds=20

# Time after a shutdown signal.
# range: 0..
signal_grace_seconds=2

# Maximum lines per panic excerpt.
# whole: 1..
panic_context_lines=3

# Maximum panic excerpt lines.
# whole: 1..
panic_max_lines=40

# Maximum dirty build paths in a label.
# whole: 1..
dirty_path_limit=10

# Maximum iterations when measuring the current margin.
# whole: 1..
fit_iterations=12

# Default clear viewport fraction on each side.
# range: 0..
default_margin=0.1
