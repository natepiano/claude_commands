# Maximum time for one concurrent relay and retire batch.
sender_batch_seconds=90
# Reserve two seconds to kill sender groups and reap their direct children.
sender_cleanup_seconds=2
# Reserve ten seconds of each pass for the alerts found during inspection.
delivery_reserve_seconds=10
# Give the owner two minutes to respond before a persistent prompt alerts the user.
prompt_grace_seconds=120
# Apply only to the latest parsed turn-end status, including transcript fallback.
# These waits remain quiet even when a full context would otherwise wake a unit.
paused_status_pattern=\bpaus(?:e[ds]?|ing)\b
external_wait_pattern=\b(?:wait(?:ing)?|held|holding|blocked)\b.*?\b(?:on|for)\s+(?:the\s+)?(?P<owner>.+)
# External owners and sessions, including the standing natedev showrunner.
# Live peer unit and showrunner names also match. Hyphens join owner words.
# Unqualified writers/workers/reviewers and tests remain the unit's own work:
# work_running keeps them quiet while active and allows recovery when they stop.
external_owner_pattern=^(?:(?:showrunner|natedev|user|owner|someone|somebody|session)|unit(?!\s+tests?\b)|(?:another|other|a)\s+(?:unit|session)|[\w.-]+-unit|(?:session|codex):[\w-]+(?:\.[\w-]+)*)(?![\w-]|\.\w)
# A party occurrence inside a complete own name or address does not count.
# Hyphens join words; a sentence period ends a name, but .v2 continues it.
# Own workers, work orders, tests and builds count only while work_running sees them.
holding_party_pattern=(?<![\w-])(?<!\w\.)(?:(?:showrunner|natedev|user|you|your)|(?:another|other|a)\s+(?:unit|session)|[\w.-]+-unit|(?:session|codex):[\w-]+(?:\.[\w-]+)*)(?![\w-]|\.\w)
