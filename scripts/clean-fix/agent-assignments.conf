# Clean-fix stage enablement.
#
# Agent family, model, and effort assignments live in
# ~/.claude/config/agents.conf.

# The nightly cargo clean + build + mend pass. Runs no agent, so it has no
# registry row — only this switch. Turning it off leaves the [build] allowlist
# in clean-fix.conf untouched; the pass is simply skipped.
[clean]
enabled=false

[style_eval]
enabled=false

[style_eval_review]
enabled=false

[style_fix]
enabled=false
