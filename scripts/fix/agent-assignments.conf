# Fix pipeline stage enablement — scheduled-run policy.
#
# These switches decide which stages the scheduled run (style-fix.timer on
# Linux, the org.nixos.style-fix launchd agent on macOS) runs. They are NOT a global off switch: fix-trigger.sh is the only caller that
# sets FIX_SCHEDULED=1, so every hand-invoked run — /fix run, /style_eval --fix,
# a stage script called directly — runs all three stages whatever is set here.
#
# Use /fix on|off, or /fix eval|review|fix on|off, to change them.
#
# Agent family, model, and effort assignments live in
# ~/.claude/config/agents.conf.

[style_eval]
enabled=false

[style_eval_review]
enabled=false

[style_fix]
enabled=false
