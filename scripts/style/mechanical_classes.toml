# The classes of change that a style unit applies without the user. A unit applies a finding of a class only when
# the proof of the class passes on the whole change. `mechanical_classes.py` reads this list; the unit text, the
# ticket gate and the "Big changes" part of docs/style_production.md follow it.
#
# name: the class name that the unit text and the doc use.
# proof: the proof that clears the change: `item_move` (`style_footprint.moved_files`) or `lint_removal`
#   (`style_footprint.lint_removal_files`).
# rules: the catalog rule names whose findings the class covers.
# summary: one sentence in Simplified Technical English that the unit reads.

[[class]]
name = "pure-move"
proof = "item_move"
rules = ["module-structure", "types-live-with-their-behavior", "split-by-type-ownership"]
summary = """A pure move takes one item to its owning module or to a named shared owner in the same crate, \
points its uses to the new path and keeps each old path with a re-export."""

[[class]]
name = "stale-allow-lint"
proof = "lint_removal"
rules = ["test-module-allow-boilerplate"]
summary = """A stale lint removal removes, from an allow attribute in test code, a lint name whose pattern has \
no match in the scope of the attribute, or removes the whole attribute when it keeps no lint name."""
