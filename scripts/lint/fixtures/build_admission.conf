# The fixture pins test values. Live tuning changes do not change these values.
[memory]

# Limit the number of live cloud gates.
# whole: 1..
cloud_gate_slots=9
# Show the age after this number of cloud push intervals.
# whole: 1..
cloud_gate_stale_pushes=3

# Private cgroups supply the CI readings in tests.
ci_memory_slice=hana-ci.slice
# Use runner identity in the CI row label.
ci_label=hana CI · {runner} · {job}

# Exact single-argument probes run without admission or peak history.
program_probe_arguments.rust-analyzer=--version --help -V -h

# Phase 117 measured rust-analyzer at 17.4 GiB for 81 minutes.
# The 18 GiB first peak includes build scripts and proc macros.
# range: 5e-324..1.6742321987285425e299
program_first_peak_gib.rust-analyzer=18
# Cargo uses the existing 12 GiB build estimate until this host has program history.
# range: 5e-324..1.6742321987285425e299
program_first_peak_gib.cargo=12
# Merge gates keep the first need when no anonymous profile matches.
# range: 5e-324..1.6742321987285425e299
program_first_peak_gib.merge-gate=4
# Read the highest anonymous use within this percent of progress.
# range: 5e-324..100
progress_lookahead_percent=20
# Use this rank among the anonymous samples in each progress bin.
# whole: 1..
progress_profile_rank=2
# Queue-place sampler interval, stop grace, and near-peak refresh spacing.
# range: 5e-324..
program_sample_seconds=1
# range: 5e-324..
program_stop_seconds=5
# range: 5e-324..
peak_wave_seconds=60
# 2026-10-29 freeze: full avg10 stayed below 10 during about 30 s of thrash.
# range: 5e-324..
full_pressure_limit=5.0
# The same freeze had swap 80–87% used with some avg10 29–37%.
# range: 5e-324..
swap_used_limit=85.0
# range: 5e-324..
some_pressure_limit=25.0
# Space each new start. Slot reuse does not consume spacing.
# whole: 1..
recovery_start_seconds=5

# Phase 39 replay, 2026-11-04: the original 126 builds and 64 recent builds.
# S2 used 7.8 GiB after 6.3 GiB. It sets the factor, rounded upward to one decimal place.
# range: 1..
dev_size_factor=1.1
# Cargo-berth used 1.412826538 GiB after 0.336112976 GiB.
# Its increase sets the margin, rounded upward to one decimal place.
# range: 0..1.6742321987285425e299
dev_size_margin_gib=1.1
# Option C replay: 126 builds over 14 days to 2026-10-30.
# This factor covered every replayed release step, including the 15.76 GiB incident.
# range: 1..
release_headroom=1.314

# Narrow-key replay: 2.3% of 869 no-compile runs exceeded N × 1.2.
# 1.314 removed only 2–13 more excesses and freed 15% less memory.
# The test-phase replay on 2026-10-31 had hana 2/22 and tool-based-ui-trunk 1/2
# above N × 1.2, 3/194 in total.
# range: 1..
test_phase_margin=1.2

# Refresh running-step readings even when no step waits.
# range: 5e-324..
running_pass_seconds=5
# range: 5e-324..
waiting_pass_seconds=1
# range: 5e-324..
wait_reply_seconds=60
# range: 5e-324..
query_timeout_seconds=0.5
# range: 5e-324..
replay_retention_seconds=86400
# range: 5e-324..
reconnect_seconds=2
# range: 5e-324..
silence_seconds=120
# range: 5e-324..
outage_notice_seconds=60
# Alert once when an unreadable memory reading holds build starts this long.
# range: 5e-324..
reading_alert_seconds=300
# Stop a step when the queue connection remains unavailable for this interval.
# range: 5e-324..
unreachable_limit_seconds=60
# range: 5e-324..
source_check_seconds=1
# range: 5e-324..
source_settle_seconds=2
# range: 5e-324..
override_reconnect_seconds=10
# Maximum complete request size, including its newline, in bytes.
# whole: 1..
request_max_bytes=1048576
# Log requests whose wall time exceeds this limit, with their CPU time.
# range: 5e-324..
request_slow_seconds=0.25

# Free memory safety.
# range: 5e-324..1.6742321987285425e299
safety_gib=3
# Gap for the next step of a run.
# whole: 1..
slot_gap_seconds=10
# Refresh an ordinary history estimate.
# whole: 1..
estimate_refresh_seconds=600
# Historical peak reader interval.
# whole: 1..
peak_hold_seconds=1500
