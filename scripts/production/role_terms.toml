text = "- **Callers.** `produce.md` `<LaunchUnits/>` runs `add_unit.py --production PRODUCTION_DOC <name> --plan <unit plan>` per unit (`<name>` is the Unit value less any `-unit`; `--standby` for a unit waiting on work). When the production doc has a `- **Review pool:** ` line, the showrunner runs `review_pool.py stop --production <slug>` at wrap (`docs/as-built/review-pool.md`); the first review of each type primes the pool. `/showrunner:promote_unit` runs: find the session, check fit (normalized unit name), plan, `add_unit.py … --resume <sessionId> --cwd <cwd> --plan <plan> --check`, `/exit` the session, then the same command without `--check`, then tell the user (both names when the name changed). Typing `/compact` into a blocked unit director and **Resume** stay the showrunner's own."
