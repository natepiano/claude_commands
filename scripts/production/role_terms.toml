text = "- Resume workers, natedev, 2026-10-16, about 21:30 EDT, on the installed `build-followups` merge `ba27d7b9`. A probe `rwprobe` (`accounts.py exec --probe`, claude2) in tmux, before herdr replaced it, held one real Codex seat, `tmp-rwseat`, in a scratch run dir under `/tmp/claude/delegate/` mapped to the probe through `active/<probe session id>`. `accounts.py move <probe id> claude3 --no-alert` finished at 21:31: the seat read `paused` (`paused_from` `done`, `paused_turn` false) on thread `01a14775-e8c5-7cd2-9d63-176e065faa06`, the probe was back on claude3, and the message log held the `resume-workers-<probe id>` message. Its `implement.sh --to tmp-rwseat` command replied `resumed` on the same thread. The run found that the message went only to unit sessions; it now goes to any session with recorded seats. The complete-command form of each seat line landed after this run and is held by `test_restart.py`. `reopen` was seen on real seats: units had returned six ended seats to `paused`."
reason = "Dated 2026-10-16 probe history; preserve its wording and worker identity."

