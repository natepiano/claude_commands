# cargo-tile tunables.
#
# Read by conf.zsh every time a value is used, so an edit here reaches the
# running grid within a couple of seconds — no restart, no rev bump, no
# `cargo-tile on`. Timing values are whole seconds and colors are RRGGBB;
# anything else falls back to the built-in default noted with the key.

[timing]

# How long an idle pane waits before it closes. Idle panes drop off one at a
# time, so this is also the gap between closes — and the number the trailing
# pane counts down.
#   default 15
decay_secs=5

# How long a finished run's output stays in its pane before the pane clears.
#   default 4
linger_secs=5

# Milliseconds between reflow frames. When the layout changes, one pane
# moves per frame so the shift reads as motion rather than a flash; this
# is the gap between those moves. The longest slide (29 -> 30 panes) is
# 25 frames, so 120 settles it in about three seconds. Whole ms.
#   default 120
reflow_ms=120

[color]

# Background a pane takes on when it has nothing to show: a slot with no
# run in it, and the summary when cargo-tile is watching nothing at all —
# no tiled run alive and no pre-existing cargo process left. Deep
# enough to read as green at a glance; the rest of the idle palette is dark
# text picked to stay legible on it, and lives in conf.zsh. Go much darker
# than this and that text starts to fight the tint. RRGGBB, no leading #.
#   default 9fd6a4
idle_bg=00ffa0
